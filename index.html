function previewBulkImport(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const wb=XLSX.read(e.target.result,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    if(rows.length<2){document.getElementById('bulk-preview').innerHTML='<div class="alert alert-error">File is empty or invalid.</div>';return;}
    const headers=rows[0].map(h=>String(h).trim());
    const required=['Name','Code','Unit','Rate (₹)','Supplier'];
    const missing=required.filter(r=>!headers.includes(r));
    if(missing.length>0){
      document.getElementById('bulk-preview').innerHTML=`<div class="alert alert-error">Missing columns: ${missing.join(', ')}. Please check your file headers.</div>`;
      return;
    }
    const nameIdx=headers.indexOf('Name'),codeIdx=headers.indexOf('Code'),unitIdx=headers.indexOf('Unit'),rateIdx=headers.indexOf('Rate (₹)'),supplierIdx=headers.indexOf('Supplier');
    window._bulkImportData=[];
    let previewHTML=`<div class="card-title">Preview (${rows.length-1} rows)</div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Code</th><th>Unit</th><th>Rate</th><th>Supplier</th><th>Status</th></tr></thead><tbody>`;
    rows.slice(1).forEach(row=>{
      const name=String(row[nameIdx]||'').trim();
      const code=String(row[codeIdx]||'').trim();
      const unit=String(row[unitIdx]||'KG').trim();
      const rate=parseFloat(row[rateIdx]);
    const rateFinal=isNaN(rate)?0:rate;
      const supplier=String(row[supplierIdx]||'').trim();
      if(!name||!code){previewHTML+=`<tr><td colspan="6" style="color:var(--red);">Skipping invalid row</td></tr>`;return;}
      const exists=DB.rawMaterials.find(r=>r.code===code);
      const status=exists?'<span class="status-pill status-low">UPDATE</span>':'<span class="status-pill status-ok">NEW</span>';
      window._bulkImportData.push({name,code,unit,rate:rateFinal,supplier});
      previewHTML+=`<tr><td class="td-primary">${name}</td><td class="mono" style="font-size:11px;">${code}</td><td>${unit}</td><td class="cost-tag">${fmtCurrency(rateFinal)}</td><td>${supplier}</td><td>${status}</td></tr>`;
    });
    previewHTML+=`</tbody></table></div>`;
    document.getElementById('bulk-preview').innerHTML=previewHTML;
    document.getElementById('bulk-import-btn').style.display='flex';
  };
  reader.readAsArrayBuffer(file);
}

async function confirmBulkImport(){
  if(!window._bulkImportData.length){toast('No data to import','error');return;}

  const btn=document.getElementById('bulk-import-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spinner" style="width:14px;height:14px;border-color:#fff3;border-top-color:#fff"></div> Saving...';}

  let added=0, updated=0;
  const toSave=[];

  window._bulkImportData.forEach(item=>{
    const exists=DB.rawMaterials.find(r=>r.code===item.code);
    if(exists){
      Object.assign(exists,{name:item.name,unit:item.unit,rate:item.rate,supplier:item.supplier,updatedDate:nowDate()});
      toSave.push({rm:exists, isNew:false});
      updated++;
    } else {
      const newRMId2=DB.nextId.rm++;
      const newRM={id:newRMId2,name:item.name,code:item.code,unit:item.unit,rate:item.rate,supplier:item.supplier,updatedDate:nowDate(),minStock:0};
      DB.rawMaterials.push(newRM);
      DB.inventory.push({id:newRMId2,rmId:newRMId2,quantity:0});
      toSave.push({rm:newRM, isNew:true});
      added++;
    }
  });

  addAudit('Bulk import raw materials',`${added} added, ${updated} updated`);
  closeModal('bulk-modal');
  toast(`Saving ${toSave.length} materials to Google Sheets...`,'info');

  let saved=0, failed=0;
  for(const entry of toSave){
    try{
      const result = await gasCall('saveRawMaterial',{rm:entry.rm, isNew:entry.isNew});
      if(result && result.success) saved++;
      else failed++;
    } catch(e){ failed++; }
  }

  await gasCall('addAudit',{entry:DB.auditLog[0]});

  if(failed===0){
    toast(`All ${saved} materials saved to Google Sheets`,'success');
  } else {
    toast(`${saved} saved, ${failed} failed — check GAS connection`,'error');
  }

  navigate('rawmaterials');
}

function deleteRM(id){
  const rm=getRMById(id);
  if(!rm)return;
  if(!confirm(`Delete "${rm.name}"? This cannot be undone.`))return;
  const inUse=DB.formulations.some(f=>f.items.some(i=>i.rmId===id));
  if(inUse){toast('Cannot delete — this material is used in formulations','error');return;}
  DB.rawMaterials.splice(DB.rawMaterials.findIndex(r=>r.id===id),1);
  DB.inventory=DB.inventory.filter(i=>i.rmId!==id);
  addAudit('Deleted raw material',rm.code+' — '+rm.name);
  toast('Material deleted','info');
  navigate('rawmaterials');
}

function saveRM(id){
  const name=document.getElementById('rm-name').value.trim();
  const code=document.getElementById('rm-code').value.trim();
  const unit=document.getElementById('rm-unit').value;
  const rateEl=document.getElementById('rm-rate');
  const rate=currentUser.role==='inventory'?(getRMById(id)?.rate||0):(parseFloat(rateEl.value)||0);
  const supplierEl=document.getElementById('rm-supplier');
  const supplier=supplierEl?supplierEl.value.trim():(getRMById(id)?.supplier||'');
  const updatedDate=document.getElementById('rm-updated').value;
  const minStockEl=document.getElementById('rm-minstock');
  const minStock=minStockEl?(isNaN(parseInt(minStockEl.value,10))?0:parseInt(minStockEl.value,10)):(getRMById(id)?.minStock||0);
  if(!name||!code){toast('Name and Code are required','error');return;}
  // rate can be 0 (allowed) — only block if field is completely empty/NaN
  if(currentUser.role!=='inventory'&&isNaN(parseFloat(rateEl?.value))){toast('Rate is required — enter 0 if free','error');return;}
  if(id){
    const rm=DB.rawMaterials.find(r=>r.id===id);
    const oldName=rm.name;
    // Update DB in memory
    rm.name=name; rm.code=code; rm.unit=unit; rm.rate=rate;
    rm.supplier=supplier; rm.updatedDate=updatedDate; rm.minStock=minStock;
    // Build a clean explicit object for GAS — no extra props, exact field order
    const rmForGAS={id:rm.id,name:name,code:code,unit:unit,rate:rate,supplier:supplier,updatedDate:updatedDate,minStock:minStock};
    const detail=`${code} — ${name}${oldName!==name?' (renamed from '+oldName+')':''}`;
    addAudit('Updated raw material',detail);
    toast('Saving...','info');
    gasCall('saveRawMaterial',{rm:rmForGAS,isNew:false})
      .then(()=>gasCall('addAudit',{entry:DB.auditLog[0]}))
      .then(()=>toast('Material updated ✓','success'));
  } else {
    const newRMId=DB.nextId.rm++;
    const newRM={id:newRMId,name:name,code:code,unit:unit,rate:rate,supplier:supplier,updatedDate:updatedDate,minStock:minStock};
    DB.rawMaterials.push(newRM);
    DB.inventory.push({id:newRMId,rmId:newRMId,quantity:0});
    addAudit('Added raw material',`${code} — ${name}`);
    toast('Saving...','info');
    gasCall('saveRawMaterial',{rm:newRM,isNew:true})
      .then(()=>gasCall('addAudit',{entry:DB.auditLog[0]}))
      .then(()=>toast('Material saved ✓','success'));
  }
  closeModal('rm-modal');
  navigate('rawmaterials');
}

function saveStock(){
  const rmId=parseInt(document.getElementById('st-rm').value);
  const qty=parseFloat(document.getElementById('st-qty').value);
  const date=document.getElementById('st-date').value;
  const remarks=document.getElementById('st-remarks').value.trim();
  if(!qty||qty<=0){toast('Enter valid quantity','error');return;}
  const inv=DB.inventory.find(i=>i.rmId===rmId);
  if(inv)inv.quantity+=qty;
  const rm=getRMById(rmId);
  if(rm)rm.updatedDate=date;
  const tx={id:DB.nextId.txn++,rmId,type:'purchase',qty,date,remarks,by:currentUser.username};
  DB.stockTransactions.push(tx);
  addAudit('Stock added',`${getRMById(rmId)?.name} +${qty}`);
  closeModal('stock-modal');
  toast('Saving...','info');
  gasCall('addTransaction',{transaction:tx})
    .then(()=>gasCall('updateInventory',{rmId,newQuantity:inv.quantity}))
    .then(()=>gasCall('addAudit',{entry:DB.auditLog[0]}))
    .then(()=>toast('Stock saved ✓','success'));
  navigate('inventory');
}

function saveAdjustment(){
  const rmId=parseInt(document.getElementById('adj-rm').value);
  const type=document.getElementById('adj-type').value;
  const date=document.getElementById('adj-date').value;
  const remarks=document.getElementById('adj-remarks').value.trim();
  const isInvUser=currentUser.role==='inventory';
  let qty=parseFloat(document.getElementById('adj-qty').value);
  if(isNaN(qty)){toast('Enter valid quantity','error');return;}
  // Inventory user always inputs positive; subtract types auto-negate
  if(isInvUser&&(type==='damage'||type==='adjustment')) qty=-Math.abs(qty);
  const inv=DB.inventory.find(i=>i.rmId===rmId);
  if(inv){inv.quantity+=qty;if(inv.quantity<0)inv.quantity=0;}
  const tx={id:DB.nextId.txn++,rmId,type,qty,date,remarks,by:currentUser.username};
  DB.stockTransactions.push(tx);
  addAudit(`Stock ${type}`,`${getRMById(rmId)?.name} ${qty>0?'+':''}${qty}`);
  toast('Saving...','info');
  gasCall('addTransaction',{transaction:tx})
    .then(()=>gasCall('updateInventory',{rmId,newQuantity:inv.quantity}))
    .then(()=>gasCall('addAudit',{entry:DB.auditLog[0]}))
    .then(()=>toast('Adjustment saved ✓','success'));
  navigate('inventory');
}

function _buildKittingRows(f,lots){
  let rows='';let allOk=true;
  f.items.forEach(item=>{
    const rm=getRMById(item.rmId);if(!rm)return;
    const required=item.qty*lots;
    const available=getInvByRMId(rm.id).quantity;
    const toOrder=Math.max(0,required-available);
    if(toOrder>0) allOk=false;
    const statusPill=toOrder>0?`<span class="status-pill status-out">Shortage</span>`:`<span class="status-pill status-ok">OK</span>`;
    rows+=`<tr>
      <td class="td-primary">${f.productName}</td>
      <td class="td-primary">${rm.name}</td>
      <td style="font-weight:600;">${required.toFixed(3)}</td>
      <td>${rm.unit}</td>
      <td>${available.toFixed(3)}</td>
      <td class="${toOrder>0?'kitting-shortage':'kitting-ok'}" style="font-weight:700;">${toOrder>0?toOrder.toFixed(3):'✓ 0'}</td>
      <td style="font-weight:700;color:${toOrder>0?'var(--red)':'var(--green)'};">${toOrder>0?toOrder.toFixed(3)+' '+rm.unit:'—'}</td>
      <td>${statusPill}</td>
    </tr>`;
  });
  return{rows,allOk};
}

function saveKittingAnalysis(){
  const name=document.getElementById('kn-name')?.value.trim();
  const orderRef=document.getElementById('kn-ref')?.value.trim();
  const fId=parseInt(document.getElementById('kn-form')?.value);
  const lots=parseInt(document.getElementById('kn-lots')?.value)||1;
  const notes=document.getElementById('kn-notes')?.value.trim();
  if(!name){toast('Analysis name is required','error');return;}
  const f=DB.formulations.find(x=>x.id===fId);
  if(!f){toast('Select a product','error');return;}

  let shortageCount=0;let totalRequired=0;
  const lineItems=f.items.map(item=>{
    const rm=getRMById(item.rmId);if(!rm)return null;
    const required=item.qty*lots;
    const available=getInvByRMId(rm.id).quantity;
    const toOrder=Math.max(0,required-available);
    if(toOrder>0) shortageCount++;
    totalRequired+=required;
    return{rmId:item.rmId,rmName:rm.name,rmCode:rm.code,unit:rm.unit,required,available,toOrder,finalPurchase:toOrder>0?toOrder:0};
  }).filter(Boolean);

  const rec={
    id:DB.nextId.kit++,
    name,orderRef,formId:fId,productName:f.productName,productCode:f.productCode,
    lots,notes,lineItems,shortageCount,totalRequired,
    hasShortage:shortageCount>0,
    savedBy:currentUser.name,savedAt:nowDateTime()
  };
  DB.kittingRecords.push(rec);
  addAudit('Saved kitting analysis',`${name} — ${f.productName} × ${lots} lots`);
  closeModal('kit-modal');
  toast(`Kitting analysis saved ✓ (${shortageCount} shortage(s))`,'success');
  navigate('kitting');
}

function saveQuickKittingAsRecord(){
  const fId=parseInt(document.getElementById('kit-form')?.value);
  const lots=parseInt(document.getElementById('kit-lots')?.value)||1;
  const f=DB.formulations.find(x=>x.id===fId);if(!f)return;
  // Pre-fill and open the save modal
  window._kitQuickFId=fId;
  window._kitQuickLots=lots;
  openNewKitting();
  // Set values after modal renders
  setTimeout(()=>{
    const sel=document.getElementById('kn-form');
    if(sel){sel.value=fId;previewKittingModal();}
    const lotsEl=document.getElementById('kn-lots');
    if(lotsEl){lotsEl.value=lots;previewKittingModal();}
  },50);
}

function exportSingleKittingRecord(id){
  const rec=DB.kittingRecords.find(r=>r.id===id);if(!rec)return;
  const data=[['Analysis Name','Order Ref','Product','Lots','Saved By','Date','','','','','']];
  data.push([rec.name,rec.orderRef||'',rec.productName,rec.lots,rec.savedBy,rec.savedAt,'','','','','']);
  data.push(['','','','','','','','','','','']);
  data.push(['Finished Product','Raw Material','Code','Required Qty','Unit','Available Qty','Qty to Order','Final Purchase Qty','Status']);
  rec.lineItems.forEach(li=>{
    data.push([rec.productName,li.rmName,li.rmCode,li.required.toFixed(3),li.unit,li.available.toFixed(3),li.toOrder.toFixed(3),li.finalPurchase>0?li.finalPurchase.toFixed(3)+' '+li.unit:'—',li.toOrder>0?'SHORTAGE':'OK']);
  });
  dlExcel(data,`Kitting_${rec.name.replace(/\s+/g,'_')}`);
}

function exportAllKittingRecords(){
  const data=[['Analysis Name','Order Ref','Product','Lots','Total Required KG','Shortages','Status','Saved By','Date']];
  DB.kittingRecords.forEach(rec=>{
    data.push([rec.name,rec.orderRef||'',rec.productName,rec.lots,rec.totalRequired.toFixed(2),rec.shortageCount,rec.hasShortage?'SHORTAGE':'ALL OK',rec.savedBy,rec.savedAt]);
  });
  dlExcel(data,'Kitting_All_Records');
}

function filterRMUTable(){
  const rmId=document.getElementById('rmu-rm-filter')?.value||'';
  const q=(document.getElementById('rmu-search')?.value||'').toLowerCase();
  document.querySelectorAll('#rmu-table tbody tr').forEach(row=>{
    const matchRm=!rmId||row.dataset.rmid===rmId;
    const matchQ=!q||row.textContent.toLowerCase().includes(q);
    row.style.display=(matchRm&&matchQ)?'':'none';
  });
}

function exportLabGlossReport(){
  const data=[['Product Name','Product Code','Batch No','L*','a*','b*','Gloss (GU)','Gloss Angle','Notes','Recorded By','Recorded At']];
  DB.formulations.forEach(f=>{
    if(f.labValues||f.glossValue!=null){
      data.push([f.productName,f.productCode||'',f.batchNo||'',
        f.labValues?.L!=null?f.labValues.L:'',
        f.labValues?.A!=null?f.labValues.A:'',
        f.labValues?.B!=null?f.labValues.B:'',
        f.glossValue!=null?f.glossValue:'',
        f.glossAngle||'',
        f.labNotes||'',
        f.labValues?.recordedBy||'',
        f.labValues?.recordedAt||''
      ]);
    }
  });
  if(data.length===1){toast('No LAB/Gloss data recorded yet','error');return;}
  dlExcel(data,'LAB_Gloss_Report');
}

function exportRMUsageReport(){
  const data=[['Raw Material','Code','Finished Product','Product Code','Batch No','Quantity Used','Unit','Date']];
  DB.formulations.forEach(f=>{
    f.items.forEach(item=>{
      const rm=getRMById(item.rmId);
      if(rm) data.push([rm.name,rm.code,f.productName,f.productCode,f.batchNo,item.qty.toFixed(3),rm.unit,f.mfgDate]);
    });
  });
  dlExcel(data,'RM_Usage_Report');

function openUserModal(id){
  const u=id?DB.users.find(x=>x.id===id):{};
  const modal=`<div class="modal-overlay" id="user-modal" onclick="if(event.target.id==='user-modal')closeModal('user-modal')">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">${id?'Edit':'Add'} User</div><button class="close-btn" onclick="closeModal('user-modal')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Full Name</label><input class="form-control" id="usr-name" value="${u.name||''}" placeholder="Full name"></div>
      <div class="form-group"><label>Username</label><input class="form-control" id="usr-uname" value="${u.username||''}" placeholder="login username"></div>
      <div class="form-group"><label>Password</label><input class="form-control" id="usr-pass" type="password" placeholder="${id?'Leave blank to keep current':'Set password'}"></div>
      <div class="form-group"><label>Role</label>
        <select class="form-control" id="usr-role">
          <option value="admin" ${u.role==='admin'?'selected':''}>👑 Administrator</option>
          <option value="formulation" ${u.role==='formulation'?'selected':''}>🔬 Formulation User</option>
          <option value="inventory" ${u.role==='inventory'?'selected':''}>📦 Inventory User</option>
          <option value="view" ${u.role==='view'?'selected':''}>👁 View Only</option>
          <option value="report" ${u.role==='report'?'selected':''}>📊 Report User</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('user-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser(${id||0})">Save</button>
    </div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',modal);
}

function saveUser(id){
  const name=document.getElementById('usr-name').value.trim();
  const username=document.getElementById('usr-uname').value.trim();
  const pass=document.getElementById('usr-pass').value;
  const role=document.getElementById('usr-role').value;
  if(!name||!username){toast('Fill required fields','error');return;}
  if(id){
    const u=DB.users.find(x=>x.id===id);
    u.name=name;u.username=username;u.role=role;
    if(pass)u.password=pass;
    addAudit('Updated user',`${username} — ${role}`);
    toast('Saving...','info');
    gasCall('saveUser',{user:u,isNew:false})
      .then(()=>gasCall('addAudit',{entry:DB.auditLog[0]}))
      .then(()=>toast('User updated ✓','success'));
  }else{
    if(!pass){toast('Password required','error');return;}
    const newUser={id:DB.nextId.user++,username,password:pass,name,role};
    DB.users.push(newUser);
    addAudit('Created user',`${username} — ${role}`);
    toast('Saving...','info');
    gasCall('saveUser',{user:newUser,isNew:true})
      .then(()=>gasCall('addAudit',{entry:DB.auditLog[0]}))
      .then(()=>toast('User saved ✓','success'));
  }
  closeModal('user-modal');
  navigate('users');
}

function deleteUser(id){
  if(id===currentUser.id){toast('Cannot delete yourself','error');return;}
  if(!confirm('Delete this user?'))return;
  DB.users.splice(DB.users.findIndex(u=>u.id===id),1);
  toast('User deleted','info');
  navigate('users');
}

function toggleInventoryDebit(){
  DB.settings.debitInventoryOnSave = !DB.settings.debitInventoryOnSave;
  const state = DB.settings.debitInventoryOnSave;
  addAudit('Changed inventory debit setting', state ? 'Debit ON — inventory will be deducted on save' : 'Debit OFF — inventory will NOT be deducted on save');
  toast(state ? '✅ Inventory debit turned ON' : '⚠️ Inventory debit turned OFF — stock will not be deducted', state?'success':'info');
  gasCall('saveSetting',{key:'debitInventoryOnSave',value:state})
    .then(()=>gasCall('addAudit',{entry:DB.auditLog[0]}));
  navigate('settings');
}

function savePkgCost(){
  const v=parseFloat(document.getElementById('pkg-cost').value);
  if(isNaN(v)||v<0){toast('Invalid value','error');return;}
  DB.packagingCost=v;
  addAudit('Updated packaging cost',`₹${v} per batch`);
  toast('Saving...','info');
  gasCall('saveSetting',{key:'packagingCost',value:v})
    .then(()=>gasCall('addAudit',{entry:DB.auditLog[0]}))
    .then(()=>toast('Settings saved ✓','success'));
}
function saveGASUrl(){
  toast('URL saved — Please edit the GAS_URL variable in the HTML file source code and re-deploy','info');
}

function exportInventoryExcel(){
  const headers=['Material Name','Code','Unit','Available Qty','Min Stock','Status','Last Updated'];
  if(can('viewPrice'))headers.push('Rate (₹)','Stock Value (₹)');
  const data=[headers];
  DB.rawMaterials.forEach(rm=>{
    const inv=getInvByRMId(rm.id);
    const row=[rm.name,rm.code,rm.unit,inv.quantity,rm.minStock,getStockStatus(rm).toUpperCase(),rm.updatedDate];
    if(can('viewPrice'))row.push(rm.rate,(inv.quantity*rm.rate).toFixed(2));
    data.push(row);
  });
  if(can('viewPrice')){
    const totalVal=DB.rawMaterials.reduce((s,rm)=>s+(getInvByRMId(rm.id).quantity*rm.rate),0);
    data.push(['','','','','','','TOTAL','',totalVal.toFixed(2)]);
  }
  dlExcel(data,'Inventory_Report');
}
function exportBatchExcel(){
  const data=[['Product Name','Product Code','Batch No','Mfg Date & Time','Lots','Total Qty (KG)','Created By','Created At']];
  DB.formulations.forEach(f=>data.push([f.productName,f.productCode,f.batchNo,f.mfgDate,f.lots||1,calcTotalQty(f).toFixed(2),f.byName,f.createdAt]));
  dlExcel(data,'Batch_History');
}
function exportConsumptionExcel(){
  const data=[['Date','Material','Code','Type','Qty','Remarks','By']];
  DB.stockTransactions.forEach(tx=>{
    const rm=getRMById(tx.rmId);
    data.push([tx.date,rm?rm.name:'Unknown',rm?rm.code:'',tx.type,tx.qty,tx.remarks||'',tx.by]);
  });
  dlExcel(data,'Consumption_Report');
}
function exportCostingExcel(){
  if(!can('viewCost')){toast('Access denied','error');return;}
  const data=[['Batch No','Product Name','Product Code','Lots','RM Cost (₹)','Packaging (₹)','Total Cost (₹)','Cost/KG (₹)','Mfg Date','Created By']];
  DB.formulations.forEach(f=>{
    const c=calcBatchCost(f);const q=calcTotalQty(f);
    data.push([f.batchNo,f.productName,f.productCode,f.lots||1,c.rmCost.toFixed(2),c.packaging.toFixed(2),c.total.toFixed(2),(c.total/q).toFixed(2),f.mfgDate,f.byName]);
  });
  dlExcel(data,'Costing_Report');
}
function exportFormulationExcel(id){
  const f=DB.formulations.find(x=>x.id===id);if(!f)return;
  const data=[['Material','Code','Unit','Qty Used (per lot)','Total Qty Used']];
  f.items.forEach(item=>{const rm=getRMById(item.rmId);if(rm)data.push([rm.name,rm.code,rm.unit,item.qty/(f.lots||1),item.qty]);});
  if(can('viewCost')){
    const cost=calcBatchCost(f);
    data.push(['','','','','']);
    data.push(['RM Cost','','','',cost.rmCost]);
    data.push(['Packaging','','','',cost.packaging]);
    data.push(['TOTAL','','','',cost.total]);
  }
  dlExcel(data,`Formulation_${f.batchNo}`);
}
function dlExcel(data,name){
  const ws=XLSX.utils.aoa_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Report');
  XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Excel file downloaded','success');
}

function exportAllBatchPDFs(){
  const myForms=currentUser.role==='formulation'?DB.formulations.filter(f=>f.by===currentUser.username):DB.formulations;
  if(myForms.length===0){toast('No formulations found','error');return;}
  const opts=myForms.map(f=>`<option value="${f.id}">${f.batchNo} — ${f.productName} (${f.mfgDate})</option>`).join('');
  const m=`<div class="modal-overlay" id="allpdf-modal" onclick="if(event.target.id==='allpdf-modal')closeModal('allpdf-modal')">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Select Batch for PDF</div><button class="close-btn" onclick="closeModal('allpdf-modal')">✕</button></div>
    <div class="modal-body"><div class="form-group"><label>Select Batch</label><select class="form-control" id="allpdf-sel">${opts}</select></div></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('allpdf-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="closeModal('allpdf-modal');exportFormulationPDF(parseInt(document.getElementById('allpdf-sel').value))">Export PDF</button>
    </div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',m);
}

function openStandaloneScaler(){
  // Build sorted formulation options (latest date first)
  const sortedForms=[...DB.formulations].sort((a,b)=>(b.mfgDate||'').localeCompare(a.mfgDate||''));
  const formOptsHTML=sortedForms.map(f=>`<option value="${f.id}" data-name="${f.productName.toLowerCase()}" data-code="${(f.productCode||'').toLowerCase()}" data-date="${f.mfgDate||''}">${f.productName}${f.productCode?' ('+f.productCode+')':''} — ${f.mfgDate?f.mfgDate.slice(0,10):''} — ${calcTotalQty(f).toFixed(2)} KG</option>`).join('');

  const modal=`<div class="modal-overlay" id="standalone-scaler-modal" onclick="if(event.target.id==='standalone-scaler-modal')closeModal('standalone-scaler-modal')">

      <!-- Hidden opts store -->
      <div id="ss-form-opts-store" style="display:none;">${formOptsHTML}</div>

      <div class="scaler-card">
        <div style="font-size:12px;font-weight:700;color:#1e40af;margin-bottom:12px;text-transform:uppercase;letter-spacing:.7px;">📦 Products to Scale</div>

function _ssBuildDropItems(n, filterText, filterDate){
  const items=[];
  DB.formulations.forEach(f=>{
    const nameMatch=!filterText||(f.productName.toLowerCase().includes(filterText)||((f.productCode||'').toLowerCase().includes(filterText))||((f.mfgDate||'').includes(filterText)));
    const dateMatch=!filterDate||(f.mfgDate&&f.mfgDate.startsWith(filterDate));
    if(nameMatch&&dateMatch)items.push(f);
  });
  // Sort latest first
  items.sort((a,b)=>(b.mfgDate||'').localeCompare(a.mfgDate||''));
  return items;
}

function ssOpenFormDrop(n){
  const filterText=(document.getElementById('ss-sp-search-'+n)?.value||'').toLowerCase().trim();
  const filterDate=document.getElementById('ss-sp-date-'+n)?.value||'';
  const drop=document.getElementById('ss-sp-drop-'+n);
  if(!drop)return;
  const items=_ssBuildDropItems(n,filterText,filterDate);
  if(items.length===0){
    drop.innerHTML=`<div style="padding:10px 12px;font-size:12px;color:var(--text3);">No formulations found</div>`;
  } else {
    drop.innerHTML=items.map(f=>{
      const base=calcTotalQty(f).toFixed(2);
      const dateStr=f.mfgDate?f.mfgDate.slice(0,10):'';
      const typeBadge=f.productType?`<span style="background:#dbeafe;color:#1e40af;border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;margin-left:4px;">${f.productType}</span>`:'';
      const finBadge=f.productFinish?`<span style="background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;margin-left:2px;">${f.productFinish}</span>`:'';
      return`<div onmousedown="ssSelectForm(${n},${f.id})" style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;" onmouseover="this.style.background='var(--accent-light)'" onmouseout="this.style.background=''">
        <div style="font-size:13px;font-weight:600;color:var(--text);">${f.productName} ${typeBadge}${finBadge}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px;">${f.productCode?f.productCode+' · ':''}📅 ${dateStr} · ⚗ ${base} KG base · ${f.items.length} materials</div>
      </div>`;
    }).join('');
  }
  drop.style.display='block';
}

function ssCloseFormDrop(n){
  const drop=document.getElementById('ss-sp-drop-'+n);
  if(drop)drop.style.display='none';
}

function ssFilterFormDrop(n){
  ssOpenFormDrop(n);
}

function ssSelectForm(n,fId){
  const f=DB.formulations.find(x=>x.id===fId);
  if(!f)return;
  document.getElementById('ss-sp-form-'+n).value=fId;
  document.getElementById('ss-sp-search-'+n).value=`${f.productName}${f.productCode?' ('+f.productCode+')':''}  📅 ${f.mfgDate?f.mfgDate.slice(0,10):''}`;
  ssCloseFormDrop(n);
  const base=calcTotalQty(f);
  const infoEl=document.getElementById('ss-sp-base-info-'+n);
  if(infoEl){
    const typeBadge=f.productType?`<span style="background:#dbeafe;color:#1e40af;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;">${f.productType}</span> `:'';
    const finBadge=f.productFinish?`<span style="background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;">${f.productFinish}</span> `:'';
    infoEl.innerHTML=`${typeBadge}${finBadge}<span style="color:var(--accent2);font-weight:600;">Base: ${base.toFixed(3)} KG</span> · ${f.items.length} raw materials · Batch ${f.batchNo||'—'} · ${f.mfgDate||''}`;
  }
}

function runSSScaler(){
  const resultEl=document.getElementById('ss-scaler-result');
  if(!resultEl)return;
  const rows=document.querySelectorAll('#ss-scaler-products .scaler-product-row');
  if(rows.length===0){resultEl.innerHTML='<div class="alert alert-error">Add at least one product.</div>';return;}

  const products=[];
  let hasError=false;
  rows.forEach(row=>{
    const n=row.id.replace('ss-sp-','');
    const fId=parseInt(document.getElementById('ss-sp-form-'+n)?.value)||0;
    const reqKg=parseFloat(document.getElementById('ss-sp-qty-'+n)?.value)||0;
    if(!fId||reqKg<=0){hasError=true;return;}
    const f=DB.formulations.find(x=>x.id===fId);
    if(!f||!f.items.length){hasError=true;return;}
    const baseKg=calcTotalQty(f);
    if(baseKg<=0){hasError=true;return;}
    const scaleFactor=reqKg/baseKg;
    products.push({name:f.productName+(f.productCode?' ('+f.productCode+')':''),reqKg,baseKg,scaleFactor,baseItems:f.items,f});
  });

  if(hasError||products.length===0){
    resultEl.innerHTML='<div class="alert alert-error">Please select a formulation and enter a valid quantity for each product row.</div>';
    return;
  }

  // Aggregate RM totals with stock data
  const rmTotals={};
  let grandCost=0, grandKg=0, totalShortage=0;

  products.forEach(p=>{
    p.baseItems.forEach(item=>{
      const rm=getRMById(item.rmId);if(!rm)return;
      const u=(item.unit||rm.unit||'KG').toUpperCase();
      const scaledQty=item.qty*p.scaleFactor;
      const scaledKg=(u==='G'||u==='ML')?scaledQty/1000:scaledQty;
      const rate=(item.rate!==undefined&&item.rate!==null)?item.rate:(rm.rate||0);
      const cost=scaledKg*rate;
      if(!rmTotals[item.rmId]){
        const inv=getInvByRMId(item.rmId);
        rmTotals[item.rmId]={
          rmId:item.rmId,name:rm.name,code:rm.code,unit:u,
          totalQtyKg:0,totalCost:0,
          availableKg:inv.quantity,rate
        };
      }
      rmTotals[item.rmId].totalQtyKg+=scaledKg;
      rmTotals[item.rmId].totalCost+=cost;
    });
    grandKg+=p.reqKg;
  });

  // Compute shortfall & to-purchase
  Object.values(rmTotals).forEach(r=>{
    r.shortfallKg=Math.max(0,r.totalQtyKg-r.availableKg);
    r.toPurchaseKg=r.shortfallKg;
    if(r.shortfallKg>0)totalShortage++;
    grandCost+=r.totalCost;
  });

  const grandPkg=(DB.packagingCost||0)*grandKg;
  const grandTotal=grandCost+grandPkg;
  const costPerKg=grandKg>0?grandTotal/grandKg:0;

  // Store result for export
  window._ssLastResult={products,rmTotals:Object.values(rmTotals),grandKg,grandCost,grandPkg,grandTotal,costPerKg,totalShortage,generatedAt:nowDateTime()};

  // Build product pills
  const prodPills=products.map(p=>`<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:6px 14px;margin-right:8px;margin-bottom:6px;">
    <span style="font-size:12px;font-weight:700;color:#e2e8f0;">${p.name}</span>
    <span style="font-size:11px;color:#94a3b8;">${p.reqKg} KG</span>
    <span style="font-size:10px;color:#64748b;">×${p.scaleFactor.toFixed(3)}</span>
  </div>`).join('');

  // Build RM rows with stock columns
  const rmRows=Object.values(rmTotals).map(r=>{
    const isG=r.unit==='G';
    const reqDisplay=isG?`${(r.totalQtyKg*1000).toFixed(1)} G`:`${r.totalQtyKg.toFixed(3)} KG`;
    const availDisplay=isG?`${(r.availableKg*1000).toFixed(1)} G`:`${r.availableKg.toFixed(3)} KG`;
    const shortage=r.shortfallKg>0;
    const shortfallDisplay=shortage?(isG?`${(r.shortfallKg*1000).toFixed(1)} G`:`${r.shortfallKg.toFixed(3)} KG`):'—';
    const purchaseDisplay=shortage?(isG?`<strong style="color:var(--red);">${(r.toPurchaseKg*1000).toFixed(1)} G</strong>`:`<strong style="color:var(--red);">${r.toPurchaseKg.toFixed(3)} KG</strong>`):'<span style="color:var(--green);font-weight:700;">✓ No Purchase Needed</span>';
    const statusPill=shortage?`<span style="background:var(--red-light);color:var(--red);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;">⚠ Short</span>`:`<span style="background:var(--green-light);color:var(--green);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;">✓ OK</span>`;
    return`<tr style="${shortage?'background:#fff8f8;':''}">
      <td class="td-primary" style="padding:9px 10px;">${r.name}</td>
      <td class="mono" style="padding:9px 10px;font-size:11px;color:var(--text3);">${r.code}</td>
      <td style="padding:9px 10px;font-weight:700;">${reqDisplay}</td>
      <td style="padding:9px 10px;color:${r.availableKg>=r.totalQtyKg?'var(--green)':'var(--red)'};font-weight:600;">${availDisplay}</td>
      <td style="padding:9px 10px;color:${shortage?'var(--red)':'var(--text3)'};">${shortfallDisplay}</td>
      <td style="padding:9px 10px;">${purchaseDisplay}</td>
      <td style="padding:9px 10px;">${statusPill}</td>
      ${can('viewCost')?`<td class="cost-tag" style="padding:9px 10px;">${fmtCurrency(r.totalCost)}</td>`:''}
    </tr>`;
  }).join('');

  const shortageAlert=totalShortage>0
    ?`<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--red);font-weight:600;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ${totalShortage} raw material(s) have insufficient stock — see "To Purchase" column.</div>`
    :`<div style="background:var(--green-light);border:1.5px solid #6ee7b7;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--green);font-weight:600;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> All raw materials are sufficiently stocked — no purchases needed!</div>`;

  resultEl.innerHTML=`
    ${shortageAlert}
    <div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);">
      <div style="background:#0f172a;padding:16px 20px;">
        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;">Production Plan</div>
        <div style="display:flex;flex-wrap:wrap;">${prodPills}</div>
      </div>
      <div style="padding:0;">
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;">
            <thead>
              <tr style="background:#1e293b;">
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">Raw Material</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left;text-transform:uppercase;letter-spacing:.6px;">Code</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#fbbf24;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">Required</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#34d399;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">Available</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#f87171;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">Shortfall</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#fb923c;text-align:left;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">To Purchase</th>
                <th style="padding:10px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left;text-transform:uppercase;letter-spacing:.6px;">Status</th>
                ${can('viewCost')?'<th style="padding:10px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left;text-transform:uppercase;letter-spacing:.6px;">Cost</th>':''}
              </tr>
            </thead>
            <tbody>${rmRows}</tbody>
            <tfoot>
              <tr style="background:var(--bg3);border-top:2px solid var(--border);">
                <td colspan="2" style="padding:12px 10px;font-size:12px;font-weight:800;color:var(--text);">TOTAL — ${grandKg.toFixed(2)} KG</td>
                <td style="padding:12px 10px;font-weight:800;color:var(--text);">${grandKg.toFixed(3)} KG</td>
                <td colspan="${can('viewCost')?4:4}"></td>
                ${can('viewCost')?`<td class="cost-tag" style="padding:12px 10px;font-size:14px;font-weight:800;">${fmtCurrency(grandCost)}</td>`:''}
              </tr>
            </tfoot>
          </table>
        </div>
        ${can('viewCost')?`
        <div style="padding:16px 20px;border-top:1px solid var(--border);">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
            <div style="background:var(--green-light);border:1px solid #a7f3d0;border-radius:10px;padding:14px;text-align:center;">
              <div style="font-size:10px;font-weight:700;color:#065f46;text-transform:uppercase;letter-spacing:.7px;">RM Cost</div>
              <div class="cost-tag" style="font-size:20px;font-weight:800;margin-top:6px;">${fmtCurrency(grandCost)}</div>
            </div>
            <div style="background:var(--blue-light);border:1px solid #93c5fd;border-radius:10px;padding:14px;text-align:center;">
              <div style="font-size:10px;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:.7px;">+Packaging</div>
              <div style="font-size:20px;font-weight:800;color:var(--blue);margin-top:6px;">${fmtCurrency(grandPkg)}</div>
            </div>
            <div style="background:#0f172a;border-radius:10px;padding:14px;text-align:center;">
              <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.7px;">COST / KG</div>
              <div style="font-size:32px;font-weight:900;color:#fbbf24;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;margin-top:4px;">${fmtCurrency(costPerKg)}</div>
            </div>
          </div>
          <div style="margin-top:12px;background:var(--bg3);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:13px;font-weight:700;color:var(--text2);">Grand Total (${grandKg.toFixed(2)} KG production)</span>
            <span class="cost-tag" style="font-size:22px;font-weight:900;">${fmtCurrency(grandTotal)}</span>
          </div>
        </div>`:''}
      </div>
    </div>`;

  // Show export buttons
  const excelBtn=document.getElementById('ss-export-excel-btn');
  const pdfBtn=document.getElementById('ss-export-pdf-btn');
  if(excelBtn)excelBtn.style.display='flex';
  if(pdfBtn)pdfBtn.style.display='flex';
}

function ssScalerExportExcel(){
  const d=window._ssLastResult;
  if(!d){toast('Run calculation first','error');return;}
  const headers=['Raw Material','Code','Required Qty (KG)','Available Stock (KG)','Shortfall (KG)','To Purchase (KG)','Status'];
  if(can('viewCost'))headers.push('Cost (₹)');
  const data=[
    [`Batch Scaler Report — Generated: ${d.generatedAt}`],
    [`Products: ${d.products.map(p=>p.name+' '+p.reqKg+'KG').join(' | ')}`],
    [],
    headers
  ];
  d.rmTotals.forEach(r=>{
    const row=[r.name,r.code,r.totalQtyKg.toFixed(3),r.availableKg.toFixed(3),r.shortfallKg.toFixed(3),r.toPurchaseKg.toFixed(3),r.shortfallKg>0?'PURCHASE NEEDED':'OK'];
    if(can('viewCost'))row.push(r.totalCost.toFixed(2));
    data.push(row);
  });
  data.push([]);
  if(can('viewCost')){
    data.push(['','','','','','RM Cost (₹)',d.grandCost.toFixed(2)]);
    data.push(['','','','','','+Packaging (₹)',d.grandPkg.toFixed(2)]);
    data.push(['','','','','','TOTAL COST (₹)',d.grandTotal.toFixed(2)]);
    data.push(['','','','','','COST / KG (₹)',(d.grandKg>0?d.grandTotal/d.grandKg:0).toFixed(2)]);
  }
  dlExcel(data,`BatchScaler_${nowDate()}`);
}

function ssScalerPrintPDF(){
  const d=window._ssLastResult;
  if(!d){toast('Run calculation first','error');return;}
  const printDate=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const showCost=can('viewCost');

  const prodRows=d.products.map((p,i)=>`<tr><td>${i+1}</td><td><strong>${p.name}</strong></td><td>${p.reqKg} KG</td><td>${p.baseKg.toFixed(3)} KG</td><td>×${p.scaleFactor.toFixed(4)}</td></tr>`).join('');

  const rmRows=d.rmTotals.map((r,i)=>{
    const shortage=r.shortfallKg>0;
    return`<tr style="${shortage?'background:#fff5f5;':''}">

      ${showCost?`<td style="font-weight:600;">₹${r.totalCost.toLocaleString('en-IN',{minimumFractionDigits:2})}</td>`:''}
    </tr>`;
  }).join('');

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Batch Scaler Report</title>
<style>

tr:nth-child(even) td{background:#f8fafc;}
.shortage td{background:#fff5f5!important;}
.alert-ok{background:#f0fdf4;border:1.5px solid #6ee7b7;border-radius:8px;padding:8px 12px;color:#166534;font-weight:700;font-size:10pt;margin-bottom:12px;}
.alert-err{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:8px;padding:8px 12px;color:#dc2626;font-weight:700;font-size:10pt;margin-bottom:12px;}
.cost-summary{display:flex;gap:12px;margin-top:14px;}
.cost-box{border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;flex:1;text-align:center;}
.cost-box .label{font-size:8.5pt;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;}
.cost-box .value{font-size:15pt;font-weight:800;color:#059669;margin-top:4px;}
.cost-box.highlight{background:#0f172a;}
.cost-box.highlight .label{color:#64748b;}
.cost-box.highlight .value{color:#fbbf24;font-size:20pt;}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="company">Surface Paints Pvt. Ltd.</div>
    <div class="sub">Batch Scaler — Raw Material Requirements Report</div>
  </div>
  <div class="right">
    <div><strong>Generated:</strong> ${printDate}</div>
    <div><strong>Total Production:</strong> ${d.grandKg.toFixed(2)} KG</div>
    <div><strong>Products:</strong> ${d.products.length}</div>
  </div>
</div>

<div class="${d.totalShortage>0?'alert-err':'alert-ok'}">${d.totalShortage>0?`⚠ ${d.totalShortage} raw material(s) need to be purchased before production can begin.`:'✓ All raw materials are sufficiently stocked — production can begin immediately.'}</div>

<h2>📦 Production Plan</h2>
<table>
  <thead><tr><th>#</th><th>Product</th><th>Required (KG)</th><th>Base Batch (KG)</th><th>Scale Factor</th></tr></thead>
  <tbody>${prodRows}</tbody>
</table>

<h2>🧪 Raw Material Requirements</h2>
<table>
  <thead><tr><th>#</th><th>Raw Material</th><th>Code</th><th>Required</th><th>Available</th><th>Shortfall</th><th>To Purchase</th><th>Status</th>${showCost?'<th>Cost (₹)</th>':''}</tr></thead>
  <tbody>${rmRows}</tbody>
  <tfoot>
    <tr style="background:#1e293b;">
      <td colspan="3" style="color:#fff;font-weight:800;padding:8px;">TOTAL — ${d.grandKg.toFixed(2)} KG production</td>
      <td style="color:#fbbf24;font-weight:800;">${d.grandKg.toFixed(3)} KG</td>
      <td colspan="${showCost?4:4}" style="color:#fff;">${d.totalShortage} shortage(s)</td>
      ${showCost?`<td style="color:#fbbf24;font-weight:800;">₹${d.grandCost.toLocaleString('en-IN',{minimumFractionDigits:2})}</td>`:''}
    </tr>
  </tfoot>
</table>

${showCost?`
<h2>💰 Cost Summary</h2>
<div class="cost-summary">
  <div class="cost-box"><div class="label">RM Cost</div><div class="value">₹${d.grandCost.toLocaleString('en-IN',{minimumFractionDigits:2})}</div></div>
  <div class="cost-box"><div class="label">Packaging</div><div class="value" style="color:#2563eb;">₹${d.grandPkg.toLocaleString('en-IN',{minimumFractionDigits:2})}</div></div>
  <div class="cost-box"><div class="label">Grand Total</div><div class="value" style="color:#1e293b;">₹${d.grandTotal.toLocaleString('en-IN',{minimumFractionDigits:2})}</div></div>
  <div class="cost-box highlight"><div class="label">Cost / KG</div><div class="value">₹${(d.grandKg>0?d.grandTotal/d.grandKg:0).toLocaleString('en-IN',{minimumFractionDigits:2})}</div></div>
</div>`:''}

<div style="margin-top:20px;padding-top:10px;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;font-size:8.5pt;color:#94a3b8;">
  <span>Surface Paints Pvt. Ltd. — Batch Scaler Report</span>
  <span>Generated: ${printDate}</span>
</div>
</body></html>`;

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const old=document.getElementById('ss-pdf-overlay');if(old)old.remove();
  const overlay=document.createElement('div');
  overlay.id='ss-pdf-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:#1a1a1a;z-index:9999;display:flex;flex-direction:column;';
  const toolbar=document.createElement('div');
  toolbar.style.cssText='background:#111827;padding:12px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #374151;flex-shrink:0;';
  toolbar.innerHTML=`
    <span style="color:#f59e0b;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;">⚖️ Batch Scaler Report</span>
    <span style="flex:1"></span>
    <button onclick="document.getElementById('ss-pdf-frame').contentWindow.print()" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;border:none;padding:9px 22px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;border-radius:8px;font-weight:700;">🖨 Print / Save as PDF</button>
    <a href="${url}" download="BatchScaler_${nowDate()}.html" style="background:#3b82f6;color:#fff;border:none;padding:9px 22px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;border-radius:8px;font-weight:700;text-decoration:none;">↓ Download</a>
    <button onclick="document.getElementById('ss-pdf-overlay').remove();URL.revokeObjectURL('${url}')" style="background:#374151;color:#fff;border:1px solid #4b5563;padding:9px 16px;font-size:13px;cursor:pointer;border-radius:8px;">✕ Close</button>`;
  const iframe=document.createElement('iframe');
  iframe.id='ss-pdf-frame';iframe.src=url;
  iframe.style.cssText='flex:1;border:none;background:#fff;';
  overlay.appendChild(toolbar);overlay.appendChild(iframe);
  document.body.appendChild(overlay);
  toast('PDF ready — use Print / Save as PDF button','success');
}

// ════════════════════════════════════════════════════════
//  MODAL UTIL
// ════════════════════════════════════════════════════════
function closeModal(id){document.getElementById(id)?.remove();formItemCount=0;caItemCount=0;}
</script>
</body>
</html>

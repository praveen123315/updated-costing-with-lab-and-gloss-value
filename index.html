<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surface Paints Pvt. Ltd. — Powder Coating Costing Software</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f4f6fb;
  --bg2: #ffffff;
  --bg3: #eef1f8;
  --border: #e1e6f0;
  --border2: #c8d0e8;
  --accent: #2563eb;
  --accent2: #1d4ed8;
  --accent-light: #eff6ff;
  --red: #dc2626;
  --red-light: #fef2f2;
  --green: #16a34a;
  --green-light: #f0fdf4;
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --purple: #7c3aed;
  --purple-light: #f5f3ff;
  --teal: #0891b2;
  --teal-light: #ecfeff;
  --orange: #ea580c;
  --orange-light: #fff7ed;
  --gold: #b45309;
  --gold-light: #fffbeb;
  --text: #1a1f36;
  --text2: #4b5675;
  --text3: #8b95b0;
  --card: #ffffff;
  --sidebar-w: 262px;
  --shadow: 0 1px 4px rgba(37,99,235,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(37,99,235,0.10), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 48px rgba(37,99,235,0.14);
  --radius: 10px;
  --radius-lg: 14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
code,pre,.mono{font-family:'JetBrains Mono',monospace;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg3);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.icon-svg{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#eef4ff 0%,#f5f8ff 40%,#e8f0fe 100%);position:relative;overflow:hidden;}
#login-screen::before{content:'';position:absolute;top:-20%;right:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(37,99,235,0.10) 0%,transparent 70%);pointer-events:none;}
#login-screen::after{content:'';position:absolute;bottom:-10%;left:-5%;width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,0.08) 0%,transparent 70%);pointer-events:none;}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:44px 40px;width:440px;position:relative;z-index:1;box-shadow:0 20px 60px rgba(37,99,235,0.12),0 4px 16px rgba(0,0,0,0.06);}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .logo-wrap{width:auto;height:80px;background:transparent;border-radius:0;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;}
.login-logo h1{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.5px;}
.login-logo p{color:var(--text2);font-size:13px;margin-top:4px;}
.form-group{margin-bottom:16px;}
.form-group label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:7px;}
.form-control{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.12);}
select.form-control option{background:#fff;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all 0.15s;}
.btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,0.25);}
.btn-primary:hover{box-shadow:0 4px 16px rgba(37,99,235,0.35);transform:translateY(-1px);}
.btn-secondary{background:var(--bg);color:var(--text);border:1.5px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.btn-danger{background:var(--red-light);color:var(--red);border:1.5px solid #fca5a5;}
.btn-danger:hover{background:#fecaca;}
.btn-success{background:var(--green-light);color:var(--green);border:1.5px solid #6ee7b7;}
.btn-success:hover{background:#a7f3d0;}
.btn-blue{background:var(--blue-light);color:var(--blue);border:1.5px solid #93c5fd;}
.btn-blue:hover{background:#bfdbfe;}
.btn-teal{background:var(--teal-light);color:var(--teal);border:1.5px solid #5eead4;}
.btn-teal:hover{background:#99f6e4;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-full{width:100%;justify-content:center;padding:13px;}
.demo-logins{margin-top:20px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;}
.demo-logins h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px;}
.demo-login-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:none;padding:6px 4px;color:var(--text2);font-size:12px;font-family:inherit;cursor:pointer;transition:color 0.2s;border-radius:6px;}
.demo-login-btn:hover{color:var(--text);background:var(--border);}
.demo-login-btn span{color:var(--text3);}

/* LAYOUT */
#app{display:none;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;box-shadow:var(--shadow);}
.sidebar-header{padding:20px 18px 16px;border-bottom:1px solid var(--border);}
.sidebar-logo{display:flex;align-items:center;gap:10px;}
.sidebar-logo .s-icon{width:44px;height:44px;background:transparent;border-radius:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.sidebar-logo span{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-0.2px;line-height:1.2;}
.sidebar-user{margin:12px 12px 0;background:linear-gradient(135deg,#eff6ff,#f0f7ff);border:1px solid #bfdbfe;border-radius:10px;padding:12px 14px;}
.sidebar-user .user-name{font-size:13px;font-weight:700;color:var(--text);}
.sidebar-user .user-role{font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-top:2px;}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto;}
.nav-section{margin-bottom:18px;}
.nav-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);padding:0 8px;margin-bottom:4px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all 0.15s;border:1.5px solid transparent;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:var(--accent-light);color:var(--accent);border-color:#bfdbfe;font-weight:600;}
.nav-item .nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);}
.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.topbar-title{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-0.3px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-admin{background:var(--accent-light);color:var(--accent2);}
.badge-form{background:var(--green-light);color:#059669;}
.badge-view{background:var(--blue-light);color:#2563eb;}
.badge-report{background:var(--purple-light);color:#7c3aed;}
.badge-inventory{background:var(--teal-light);color:#0d9488;}
.page{padding:28px;flex:1;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.5px;}
.page-subtitle{color:var(--text2);font-size:13px;margin-top:3px;}

/* SEARCH BAR */
.search-filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.search-input-wrap{position:relative;flex:1;min-width:200px;}
.search-input-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);}
.search-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:9px 14px 9px 36px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color 0.2s;}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.10);}
.filter-select{background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;cursor:pointer;}
.filter-select:focus{border-color:var(--accent);}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);}
.card-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:16px;display:flex;align-items:center;gap:7px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow 0.2s,transform 0.2s;}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.stat-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.stat-icon.amber{background:var(--accent-light);}
.stat-icon.green{background:var(--green-light);}
.stat-icon.blue{background:var(--blue-light);}
.stat-icon.purple{background:var(--purple-light);}
.stat-icon.red{background:var(--red-light);}
.stat-icon.teal{background:var(--teal-light);}
.stat-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;}
.stat-value{font-size:28px;font-weight:800;color:var(--text);margin:4px 0 3px;letter-spacing:-1px;}
.stat-sub{font-size:12px;color:var(--text3);}

/* TABLE */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--text3);padding:10px 14px;text-align:left;border-bottom:1.5px solid var(--border);background:var(--bg3);}
th:first-child{border-radius:8px 0 0 0;}
th:last-child{border-radius:0 8px 0 0;}
td{padding:12px 14px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);color:var(--text);}
.td-primary{color:var(--text);font-weight:600;}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.status-ok{background:var(--green-light);color:#059669;}
.status-low{background:var(--accent-light);color:var(--accent2);}
.status-out{background:var(--red-light);color:var(--red);}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,0.45);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-lg{max-width:800px;}
.modal-header{padding:22px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-0.3px;}
.modal-body{padding:20px 24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--bg3);border-radius:0 0 18px 18px;}
.close-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:16px;line-height:1;padding:6px 8px;border-radius:7px;transition:all 0.15s;}
.close-btn:hover{background:var(--red-light);color:var(--red);border-color:#fca5a5;}

/* FORM */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.form-group{margin-bottom:14px;}
.form-group label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px;}
.form-hint{font-size:11px;color:var(--text3);margin-top:4px;}
textarea.form-control{resize:vertical;min-height:80px;}

/* FORMULATION ITEMS */
.fi-row{display:grid;grid-template-columns:1fr 100px 90px 90px 40px;gap:8px;align-items:center;margin-bottom:8px;}
.fi-row.no-cost{grid-template-columns:1fr 120px 100px 40px;}
.fi-unit{font-size:11px;font-weight:600;color:var(--text2);padding:11px 10px;background:var(--bg3);border:1.5px solid var(--border);border-radius:7px;white-space:nowrap;text-align:center;}
.fi-cost{font-size:12px;font-weight:700;color:#059669;font-family:'JetBrains Mono',monospace;padding:11px 6px;background:var(--green-light);border:1.5px solid #a7f3d0;border-radius:7px;text-align:right;min-width:90px;}
.fi-rate{font-size:12px;font-weight:600;color:var(--blue);font-family:'JetBrains Mono',monospace;padding:9px 8px;background:var(--blue-light);border:1.5px solid #93c5fd;border-radius:7px;text-align:right;width:100%;outline:none;font-family:inherit;}
.fi-rate:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,0.15);}
.fi-rate-changed{background:#fffbeb;border-color:#f59e0b;color:#92400e;}
.add-item-btn{color:var(--accent2);background:var(--accent-light);border:1.5px dashed #fcd34d;border-radius:8px;padding:9px;cursor:pointer;font-size:12px;font-weight:600;width:100%;font-family:inherit;transition:all 0.15s;}
.add-item-btn:hover{background:#fef08a;border-color:var(--accent);}
.remove-btn{background:var(--red-light);border:1px solid #fca5a5;color:var(--red);border-radius:7px;width:34px;height:34px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.remove-btn:hover{background:#fecaca;}
.fm-live-total{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:10px;padding:14px 18px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.fm-lt-item{text-align:center;}
.fm-lt-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#94a3b8;}
.fm-lt-value{font-size:16px;font-weight:800;color:#f1f5f9;font-family:'JetBrains Mono',monospace;margin-top:2px;}
.fm-lt-value.green{color:#34d399;}
.fm-lt-value.amber{color:#fbbf24;}
.fi-header{display:grid;grid-template-columns:1fr 100px 90px 90px 40px;gap:8px;margin-bottom:4px;padding:0 2px;}
.fi-header.no-cost{grid-template-columns:1fr 120px 100px 40px;}
.fi-header span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);}

/* COST/KG BIG DISPLAY */
.cost-per-kg-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:14px;padding:18px 28px;margin-top:12px;}
.cost-per-kg-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#94a3b8;margin-bottom:4px;}
.cost-per-kg-value{font-size:36px;font-weight:900;color:#fbbf24;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;line-height:1;}
.cost-per-kg-sub{font-size:12px;color:#64748b;margin-top:6px;}

/* SCALER SECTION */
.scaler-card{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border:2px solid #bfdbfe;border-radius:14px;padding:18px;margin-bottom:16px;}
.scaler-product-row{background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;position:relative;}
.scaler-result-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
.scaler-result-table th{background:#1e293b;color:#94a3b8;padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;}
.scaler-result-table td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text2);}
.scaler-result-table tr:last-child td{border-bottom:none;}
.scaler-total-row td{font-weight:800;color:var(--text);background:var(--accent-light);}

.alert{border-radius:10px;padding:12px 14px;font-size:13px;font-weight:500;margin-bottom:16px;display:flex;align-items:flex-start;gap:9px;}
.alert-warning{background:var(--accent-light);border:1.5px solid #fde68a;color:#92400e;}
.alert-error{background:var(--red-light);border:1.5px solid #fca5a5;color:#991b1b;}
.alert-success{background:var(--green-light);border:1.5px solid #6ee7b7;color:#065f46;}
.alert-info{background:var(--blue-light);border:1.5px solid #93c5fd;color:#1e40af;}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--bg3);border:1.5px solid var(--border);border-radius:11px;padding:4px;margin-bottom:20px;width:fit-content;flex-wrap:wrap;}
.tab{padding:7px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all 0.15s;display:flex;align-items:center;gap:6px;}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:var(--shadow);}
.tab:hover:not(.active){color:var(--text);}

/* STOCK BAR */
.stock-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:6px;}
.stock-bar-fill{height:100%;border-radius:3px;transition:width 0.4s;}
.stock-bar-fill.ok{background:var(--green);}
.stock-bar-fill.low{background:var(--accent);}
.stock-bar-fill.out{background:var(--red);}

/* COST TAG */
.cost-tag{font-family:'JetBrains Mono',monospace;font-size:13px;color:#059669;font-weight:500;}

/* TOAST */
#toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:13px;font-weight:500;min-width:260px;box-shadow:var(--shadow-lg);animation:slideIn 0.3s ease;display:flex;align-items:center;gap:9px;}
.toast.success{border-left:4px solid var(--green);}
.toast.error{border-left:4px solid var(--red);}
.toast.info{border-left:4px solid var(--accent);}
@keyframes slideIn{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* RAW MATERIAL SEARCH DROPDOWN */
.rm-search-wrap{position:relative;}
.rm-search-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:10px 36px 10px 10px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color 0.2s;cursor:pointer;}
.rm-search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,0.10);}
.rm-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1.5px solid var(--accent);border-radius:8px;box-shadow:var(--shadow-lg);z-index:1000;max-height:220px;overflow-y:auto;margin-top:3px;display:none;}
.rm-dropdown.open{display:block;}
.rm-dropdown-item{padding:9px 12px;font-size:13px;cursor:pointer;color:var(--text);transition:background 0.1s;display:flex;align-items:center;justify-content:space-between;}
.rm-dropdown-item:hover,.rm-dropdown-item.highlighted{background:var(--accent-light);color:var(--accent2);}
.rm-dropdown-item .rm-code{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.rm-dropdown-empty{padding:12px;font-size:12px;color:var(--text3);text-align:center;}
.batch-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:10px;transition:all 0.2s;box-shadow:var(--shadow);}
.batch-card:hover{border-color:var(--border2);box-shadow:var(--shadow-md);}
.batch-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.batch-card-title{font-weight:700;color:var(--text);font-size:15px;}
.batch-card-code{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:2px;}
.batch-card-meta{display:flex;gap:14px;font-size:12px;color:var(--text3);flex-wrap:wrap;}
.batch-card-meta span{display:flex;align-items:center;gap:4px;}

/* AUDIT */
.audit-row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);}
.audit-row:last-child{border-bottom:none;}
.audit-time{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;white-space:nowrap;padding-top:2px;}
.audit-content{font-size:13px;color:var(--text2);}
.audit-content strong{color:var(--text);}
.audit-tag{color:var(--accent2);font-size:11px;font-weight:600;background:var(--accent-light);padding:1px 7px;border-radius:20px;margin-left:4px;}

/* REPORT SECTION */
.report-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:16px;box-shadow:var(--shadow);}
.report-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);transition:all 0.2s;}
.report-card:hover{box-shadow:var(--shadow-md);border-color:var(--border2);transform:translateY(-2px);}
.report-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:22px;}

/* KITTING TABLE */
.kitting-shortage{color:var(--red);font-weight:700;}
.kitting-ok{color:var(--green);font-weight:700;}

/* BULK UPLOAD */
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--bg3);}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-light);}
.upload-zone input{display:none;}

/* SPINNER */
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-page{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;gap:14px;color:var(--text2);}

/* GAS SETUP BANNER */
.setup-banner{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1.5px solid #fcd34d;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;}
.setup-banner .sb-icon{font-size:24px;}
.setup-banner h3{font-size:14px;font-weight:700;color:#92400e;}
.setup-banner p{font-size:12px;color:#a16207;margin-top:2px;}

/* LOT MULTIPLIER */
.lot-box{background:linear-gradient(135deg,var(--blue-light),#eff6ff);border:1.5px solid #93c5fd;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.lot-box label{font-size:13px;font-weight:700;color:#1e40af;white-space:nowrap;}
.lot-input{width:80px;background:#fff;border:1.5px solid #93c5fd;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;color:#1e40af;outline:none;text-align:center;}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .main{margin-left:0;}
  .form-row,.form-row-3{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

// ════════════════════════════════════════════════════════
//  GAS API HELPER
// ════════════════════════════════════════════════════════
function gasCall(action, payload={}) {
  if (!GAS_URL) return Promise.resolve(null);
  const params = encodeURIComponent(JSON.stringify({action, ...payload}));
  const url = GAS_URL + '?data=' + params;
  return fetch(url, {method:'GET', redirect:'follow'})
    .then(r => r.json())
    .catch(e => { console.error('GAS error:', e); return null; });
}

function showSaving(){const el=document.getElementById('saving-indicator');if(el)el.style.display='flex';}
function hideSaving(){const el=document.getElementById('saving-indicator');if(el)el.style.display='none';}

async function loadFromGAS(){
  if(!GAS_URL) return;
  showSaving();
  try {
    const result = await gasCall('loadAll');
    if(result && result.success && result.data){
      const d = result.data;
      if(d.users && d.users.length) DB.users = d.users;
      if(d.rawMaterials && d.rawMaterials.length) DB.rawMaterials = d.rawMaterials;
      if(d.inventory && d.inventory.length) DB.inventory = d.inventory;
      if(d.formulations) DB.formulations = d.formulations.map(f=>({
        ...f,
        productName: f.productName||'Unnamed',
        productCode: f.productCode||'',
        productType: f.productType||'',
        productFinish: f.productFinish||'',
        batchNo: f.batchNo||'',
        mfgDate: f.mfgDate||'',
        byName: f.byName||f.by||'',
        remarks: f.remarks||'',
        refNo: f.refNo||'',
        partyId: f.partyId||'',
        partyName: f.partyName||'',
        lots: Number(f.lots)||1,
        inventoryDebited: f.inventoryDebited===false||f.inventoryDebited==='false'?false:true,
        items: Array.isArray(f.items)?f.items.map(i=>({rmId:Number(i.rmId),qty:Number(i.qty)||0,unit:i.unit||'KG',rate:(i.rate!==undefined&&i.rate!==''&&i.rate!==null)?Number(i.rate):undefined})).filter(i=>i.rmId&&i.qty>0):[],
      }));
      // ── v2.3: Patch item rates from basePrices if available ──────────────
      if(d.basePrices && Array.isArray(d.basePrices) && d.basePrices.length > 0){
        DB.formulations.forEach(function(f){
          f.items.forEach(function(item){
            if(item.rate===undefined||item.rate===null){
              const bp=d.basePrices.find(b=>b.formulationId===f.id&&b.rmId===item.rmId);
              if(bp) item.rate=bp.enteredRate;
            }
          });
        });
      }
      if(d.stockTransactions) DB.stockTransactions = d.stockTransactions;
      if(d.auditLog) DB.auditLog = d.auditLog;
      if(d.packagingCost!==undefined) DB.packagingCost = Number(d.packagingCost)||26;
      if(d.settings) DB.settings = Object.assign({debitInventoryOnSave:true}, d.settings);
      if(d.nextId) DB.nextId = d.nextId;
      DB.nextId.comment = DB.nextId.comment || 1;
      DB.formulationComments = DB.formulationComments || [];
      if(d.formulationComments && Array.isArray(d.formulationComments)) DB.formulationComments = d.formulationComments;
      if(d.basePrices && Array.isArray(d.basePrices)) DB.basePrices = d.basePrices;
      toast('Data loaded from Google Sheets ✓','success');
    } else {
      toast('Could not load from Sheets — using local data','info');
    }
  } catch(e){ toast('GAS connection error — using local data','info'); }
  hideSaving();
}

function fillLogin(u,p){document.getElementById('login-user').value=u;document.getElementById('login-pass').value=p;}
async function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value.trim();
  if(!u||!p){
    document.getElementById('login-error').innerHTML='Please enter username and password.';
    document.getElementById('login-error').style.display='flex';
    return;
  }
  const btn=document.querySelector('#login-screen .btn-primary');
  btn.innerHTML='<div class="spinner" style="width:16px;height:16px;border-color:#fff3;border-top-color:#fff"></div> Signing in...';
  btn.disabled=true;
  await loadFromGAS();
  const user=DB.users.find(x=>x.username===u&&x.password===p);
  if(!user){
    document.getElementById('login-error').innerHTML='Invalid credentials. Please try again.';
    document.getElementById('login-error').style.display='flex';
    btn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In';
    btn.disabled=false;
    return;
  }
  document.getElementById('login-error').style.display='none';
  currentUser=user;
  initApp();
}
function logout(){
  currentUser=null;
  if(dashboardRefreshTimer) clearInterval(dashboardRefreshTimer);
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
}
document.getElementById('login-pass').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});

function can(perm){
  const perms={
    admin:['dashboard','formulations','costing','rawmaterials','inventory','reports','users','settings','viewPrice','editPrice','manageUsers','viewCost','kitting','costanalysis','addStock','subtractStock'],
    formulation:['dashboard','formulations','inventory'],
    inventory:['dashboard','inventory','reports','addStock','subtractStock'],
    view:['dashboard','inventory'],
    report:['dashboard','reports','inventory'],
  };
  return(perms[currentUser.role]||[]).includes(perm);
}

let currentPage='dashboard';
function initApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('sb-username').textContent=currentUser.name;
  document.getElementById('sb-role').textContent=ROLE_LABELS[currentUser.role];
  document.getElementById('role-badge').textContent=ROLE_LABELS[currentUser.role];
  document.getElementById('role-badge').className='badge '+BADGE_CLASSES[currentUser.role];
  document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  buildSidebar();
  navigate('dashboard');
  // Auto-refresh dashboard every 60 seconds
  if(dashboardRefreshTimer) clearInterval(dashboardRefreshTimer);
  dashboardRefreshTimer = setInterval(()=>{
    if(currentPage==='dashboard') refreshDashboard();
  }, 60000);
}

function buildSidebar(){
  const nav=document.getElementById('sidebar-nav');
  nav.innerHTML='';
  (NAV_CONFIG[currentUser.role]||[]).forEach(s=>{
    const sec=document.createElement('div');sec.className='nav-section';
    sec.innerHTML=`<div class="nav-section-title">${s.section}</div>`;
    s.items.forEach(item=>{
      const el=document.createElement('div');
      el.className='nav-item';el.id='nav-'+item.id;
      el.innerHTML=`<span class="nav-icon">${NAV_ICONS[item.id]||'●'}</span>${item.label}`;
      el.onclick=()=>navigate(item.id);
      sec.appendChild(el);
    });
    nav.appendChild(sec);
  });
}

function navigate(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  const ni=document.getElementById('nav-'+page);
  if(ni)ni.classList.add('active');
  const titles={dashboard:'Dashboard',formulations:'Formulations',costing:'Costing Engine',costanalysis:'Cost Analysis',rawmaterials:'Raw Materials',inventory:'Inventory',reports:'Reports & Export',users:'User Management',settings:'System Settings',kitting:'Full Kitting',debitstatus:'Inventory Debit Status'};
  document.getElementById('page-heading').textContent=titles[page]||page;
  const content=document.getElementById('page-content');
  content.innerHTML=`<div class="loading-page"><div class="spinner"></div><span>Loading...</span></div>`;
  setTimeout(()=>renderPage(page,content),60);
}

function renderPage(page,el){
  switch(page){
    case 'dashboard':el.innerHTML=renderDashboard();break;
    case 'formulations':el.innerHTML=renderFormulations();break;
    case 'costing':el.innerHTML=can('viewCost')?renderCosting():'<div class="alert alert-error">Access denied.</div>';break;
    case 'costanalysis':el.innerHTML=can('costanalysis')?renderCostAnalysis():'<div class="alert alert-error">Access denied.</div>';break;
    case 'rawmaterials':el.innerHTML=can('editPrice')?renderRawMaterials():'<div class="alert alert-error">Access denied.</div>';break;
    case 'inventory':el.innerHTML=renderInventory();break;
    case 'reports':el.innerHTML=renderReports();break;
    case 'users':el.innerHTML=can('manageUsers')?renderUsers():'<div class="alert alert-error">Access denied.</div>';break;
    case 'settings':el.innerHTML=can('manageUsers')?renderSettings():'<div class="alert alert-error">Access denied.</div>';break;
    case 'kitting':el.innerHTML=can('kitting')?renderKitting():'<div class="alert alert-error">Access denied.</div>';break;
    case 'debitstatus':el.innerHTML=renderDebitStatus();break;
    default:el.innerHTML='<p>Page not found</p>';
  }
}

function getRMById(id){return DB.rawMaterials.find(r=>r.id===id);}
function getInvByRMId(id){return DB.inventory.find(i=>i.rmId===id)||{quantity:0};}
function getStockStatus(rm){
  const inv=getInvByRMId(rm.id);
  if(inv.quantity<=0)return 'out';
  if(inv.quantity<rm.minStock)return 'low';
  return 'ok';
}
function calcBatchCost(f){
  let rmCost=0;
  (f.items||[]).forEach(item=>{
    const rm=getRMById(item.rmId);if(!rm)return;
    // Use per-item saved rate if available, else use current RM rate
    const rate=item.rate!==undefined&&item.rate!==null?item.rate:(rm.rate||0);
    // Convert G/ML to KG before multiplying (rate is always per KG equivalent)
    const u=(item.unit||rm.unit||'KG').toUpperCase();
    const qtyKg=(u==='G'||u==='ML')?item.qty/1000:item.qty;
    rmCost+=qtyKg*rate;
  });
  const totalQty=calcTotalQty(f);
  const packagingPerKg=DB.packagingCost||0;
  const totalPackaging=packagingPerKg*totalQty;
  return{rmCost,packaging:totalPackaging,packagingPerKg,total:rmCost+totalPackaging};
}
// Returns total in KG-equivalent (G and ML items are divided by 1000)
function calcTotalQty(f){
  return (f.items||[]).reduce((s,i)=>{
    const u=(i.unit||'KG').toUpperCase();
    const qty=i.qty||0;
    if(u==='G'||u==='ML') return s+(qty/1000);
    return s+qty;
  },0);
}
// Returns unified KG total string — grams and ML converted to KG
function calcTotalQtyDisplay(f){
  const totalKg=calcTotalQty(f);
  return totalKg.toFixed(3)+' KG';
}

function nowDateTime(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}
function nowDate(){return nowDateTime().slice(0,10);}

function toast(msg,type='info'){
  const icons={success:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',error:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',info:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'};
  const t=document.createElement('div');
  t.className='toast '+type;
  t.style.color=type==='success'?'var(--green)':type==='error'?'var(--red)':'var(--accent2)';
  t.innerHTML=(icons[type]||'')+msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(),3500);
}
function fmtCurrency(n){return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function addAudit(action,detail){
  DB.auditLog.unshift({time:nowDateTime(),user:currentUser.name,action,detail});
}

// Search/filter helper
function filterTable(inputId, tableId){
  const q=document.getElementById(inputId)?.value?.toLowerCase()||'';
  const rows=document.querySelectorAll(`#${tableId} tbody tr`);
  rows.forEach(row=>{
    row.style.display=row.textContent.toLowerCase().includes(q)?'':'none';
  });
}

  }
}

function filterFormulations(){
  const q=(document.getElementById('form-search')?.value||'').toLowerCase();
  const dateFilter=document.getElementById('form-filter-date')?.value||'';
  const today=nowDate();
  const weekStart=new Date();weekStart.setDate(weekStart.getDate()-7);
  const monthStart=new Date();monthStart.setDate(1);

  document.querySelectorAll('#formulations-list .batch-card').forEach(card=>{
    const name=card.dataset.name||'';
    const code=card.dataset.code||'';
    const batch=card.dataset.batch||'';
    const date=card.dataset.date||'';
    let show=(!q||(name+code+batch).includes(q));
    if(show&&dateFilter){
      const d=new Date(date.slice(0,10));
      if(dateFilter==='today')show=date.startsWith(today);
      else if(dateFilter==='week')show=d>=weekStart;
      else if(dateFilter==='month')show=d>=monthStart;
    }
    card.style.display=show?'':'none';
  });
}

  const L=parseFloat(document.getElementById('lab-L').value)||null;
  const A=parseFloat(document.getElementById('lab-A').value)||null;
  const B=parseFloat(document.getElementById('lab-B').value)||null;
  const gloss=parseFloat(document.getElementById('lab-gloss').value)||null;
  const angle=document.getElementById('lab-angle').value;
  const notes=document.getElementById('lab-notes').value.trim();
  if(L!==null||A!==null||B!==null) f.labValues={L,A,B,recordedAt:nowDateTime(),recordedBy:currentUser.name};
  if(gloss!==null){f.glossValue=gloss;f.glossAngle=angle;}
  f.labNotes=notes;
  addAudit('Saved LAB/Gloss values',`${f.productCode||f.productName} — L:${L} a:${A} b:${B} Gloss:${gloss}`);
  closeModal('labgloss-modal');
  toast('Saving LAB/Gloss to Sheets...','info');
  gasCall('saveLabGloss',{formulation:{id:f.id,productName:f.productName,productCode:f.productCode||'',batchNo:f.batchNo||'',labValues:f.labValues||null,glossValue:f.glossValue??null,glossAngle:f.glossAngle||'',labNotes:f.labNotes||''}})
    .then(()=>gasCall('addAudit',{entry:DB.auditLog[0]}))
    .then(()=>toast('LAB & Gloss values saved ✓','success'));
  navigate('formulations');
}

function updateSudhirPreview(id){
  const f=DB.formulations.find(x=>x.id===id);

  if(!f)return;
  const perLot=f.lots||1;
  let rows='';let hasShortage=false;
  const cost=calcBatchCost(f);
  const baseQty=f.items.reduce((s,i)=>s+(i.qty/perLot),0);
  const totalQty=baseQty*lots;
  f.items.forEach(item=>{
    const rm=getRMById(item.rmId);if(!rm)return;
    const qtyPerLot=item.qty/perLot;
    const totalNeeded=qtyPerLot*lots;
    const available=getInvByRMId(rm.id).quantity;
    const ok=available>=totalNeeded;
    if(!ok)hasShortage=true;
    rows+=`<tr>
      <td class="td-primary">${rm.name}</td>
      <td>${qtyPerLot.toFixed(3)} ${rm.unit}</td>
      <td style="font-weight:700;">${totalNeeded.toFixed(3)} ${rm.unit}</td>

      <td><span class="status-pill ${ok?'status-ok':'status-out'}">${ok?'✓ OK':'⚠ LOW'}</span></td>
    </tr>`;
  });
  const rmCostPerLot=cost.rmCost/perLot;
  const totalCost=(rmCostPerLot+DB.packagingCost)*lots;
  document.getElementById('sudhir-preview').innerHTML=`
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;">

        ${hasShortage?`<span class="status-pill status-out">⚠ Stock Shortage</span>`:`<span class="status-pill status-ok">✓ Stock Sufficient</span>`}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Raw Material</th><th>Per Lot</th><th>Total (${lots} lots)</th><th>In Stock</th><th>Status</th></tr></thead>

    </div>`;
}

function generateSudhirPDF(id){
  const f=DB.formulations.find(x=>x.id===id);
  if(!f)return;

  // ── Validate lots (mandatory) ─────────────────────────
  const lotsInput=document.getElementById('sudhir-lots');
  const lots=parseInt(lotsInput?.value);
  if(!lots||lots<1){
    if(lotsInput){lotsInput.style.border='2px solid #ef4444';lotsInput.focus();}
    toast('Please enter number of lots (required)','error');
    return;
  }
  if(lotsInput) lotsInput.style.border='';

  const batchRef=document.getElementById('sudhir-batch')?.value.trim()||f.batchNo||'—';
  const printDate=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
  const printDateTime=nowDateTime();
  const perLot=f.lots||1;
  const cost=calcBatchCost(f);
  const rmCostPerLot=cost.rmCost/perLot;
  const totalRMCost=rmCostPerLot*lots;
  const totalCost=totalRMCost+(DB.packagingCost*lots);

  // ── One-time inventory debit ──────────────────────────
  const alreadyDebited = f.inventoryDebited===true || f.inventoryDebited==='true';
  let debitLog=[];
  if(!alreadyDebited){
    f.items.forEach(item=>{
      const rm=getRMById(item.rmId);if(!rm)return;
      const qtyPerLot=item.qty/perLot;
      const totalDebit=qtyPerLot*lots;
      const inv=DB.inventory.find(i=>i.rmId===item.rmId);
      if(inv){inv.quantity=Math.max(0,inv.quantity-totalDebit);}
      DB.stockTransactions.push({id:DB.nextId.txn++,rmId:item.rmId,type:'consumption',qty:-totalDebit,date:printDateTime.slice(0,10),remarks:`Sudhir PDF — ${batchRef} (${lots} lots)`,by:currentUser.username});
      debitLog.push({name:rm.name,code:rm.code,unit:rm.unit,qty:totalDebit});
    });
    f.inventoryDebited=true;
    addAudit('Sudhir PDF generated + inventory debited',`${f.productName} — ${lots} lots — Batch: ${batchRef}`);

    // Persist to Google Sheets
    const auditEntry=DB.auditLog[0];
    const invUpdates=f.items.map(item=>({rmId:item.rmId,newQuantity:(DB.inventory.find(i=>i.rmId===item.rmId)||{}).quantity||0}));
    const newTxns=DB.stockTransactions.slice(-f.items.length);
    Promise.all(invUpdates.map(u=>gasCall('updateInventory',{rmId:u.rmId,newQuantity:u.newQuantity})))
      .then(()=>Promise.all(newTxns.map(tx=>gasCall('addTransaction',{transaction:tx}))))
      .then(()=>gasCall('addAudit',{entry:auditEntry}))
      .then(()=>toast('Inventory debit saved to Sheets ✓','success'));
  } else {
    addAudit('Sudhir PDF re-printed (no debit)',`${f.productName} — ${lots} lots — Batch: ${batchRef}`);
    gasCall('addAudit',{entry:DB.auditLog[0]});
  }

  let sno=1;
  let itemRows='';
  let totalQtyAll=0;
  f.items.forEach(item=>{
    const rm=getRMById(item.rmId);if(!rm)return;
    const totalNeeded=((item.qty/perLot)*lots);
    totalQtyAll+=totalNeeded;
    const unit=item.unit||rm.unit||'KG';
    const qtyDisplay=totalNeeded%1===0?totalNeeded.toFixed(0):totalNeeded.toFixed(3);
    itemRows+=`<tr>
      <td style="text-align:center;">${sno++}</td>
      <td>${rm.name}</td>
      <td style="text-align:right;font-size:13pt;font-weight:800;">${qtyDisplay} ${unit}</td>
    </tr>`;
  });

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Production Record — ${f.productName}</title>

// Copy formulation as new (template)
function copyFormulationAsNew(id){
  const src=DB.formulations.find(x=>x.id===id);
  if(!src)return;
  openNewFormModal(src);
}

let _efCount=0;
function addEditFormItem(preRmId=null,preQty=null,preUnit=null,preRate=null){
  _efCount++;
  const id='efitem-'+_efCount;
  const preRM=preRmId?DB.rawMaterials.find(r=>r.id===preRmId):null;
  const defaultUnit=preUnit||(preRM?preRM.unit:'KG');
  const defaultRate=preRate!==null&&preRate!==undefined?preRate:(preRM?preRM.rate||0:0);
  const preLabel=preRM?`${preRM.name} (${preRM.code})`:'';
  const showCostCol=can('viewCost');
  const allUnits=['KG','G','LTR','ML','NOS','PCS','MTR','CM','MM','BOX','BAG','DRUM'];
  const unitOpts=allUnits.map(u=>`<option value="${u}" ${u===defaultUnit?'selected':''}>${u}</option>`).join('');
  document.getElementById('ef-items').insertAdjacentHTML('beforeend',`
    <div class="fi-row ${showCostCol?'':'no-cost'}" id="${id}">
      <div class="rm-search-wrap" style="position:relative;">
        <input class="rm-search-input" id="rmsearch-${id}" placeholder="🔍 Search raw material..." 
          value="${preLabel}" autocomplete="off"
          oninput="filterRMDropdownEF('${id}')"
          onfocus="openRMDropdownEF('${id}')"
          onkeydown="handleRMDropdownKeyEF(event,'${id}')">
        <div class="rm-dropdown" id="rmdrop-${id}"></div>
        <input type="hidden" id="efsel-${id}" value="${preRmId||''}">
        <input type="hidden" id="efbaserate-${id}" value="${defaultRate}">
      </div>
      <input class="form-control" id="efqty-${id}" type="number" step="0.001" min="0" value="${preQty||''}" placeholder="Qty" oninput="updateEfLiveTotal()">
      <select class="form-control" id="efunit-${id}" style="padding:10px 6px;font-size:12px;" onchange="updateEfLiveTotal()">${unitOpts}</select>
      ${showCostCol?`<input class="fi-rate" id="efrate-${id}" type="number" step="0.01" min="0" value="${defaultRate||''}" placeholder="Rate" title="Edit rate for this batch" oninput="onEfRateInput('${id}');updateEfLiveTotal()">`:''}
      ${showCostCol?`<span class="fi-cost" id="efcost-${id}">—</span>`:''}
      <button class="remove-btn" onclick="document.getElementById('${id}').remove();updateEfLiveTotal()">−</button>
    </div>`);
  if(!preRmId) openRMDropdownEF(id);
  updateEfLiveTotal();
}

function onEfRateInput(id){
  const rateEl=document.getElementById('efrate-'+id);
  const baseRate=parseFloat(document.getElementById('efbaserate-'+id)?.value)||0;
  if(!rateEl)return;
  const currentRate=parseFloat(rateEl.value)||0;
  if(currentRate!==baseRate){
    rateEl.classList.add('fi-rate-changed');
    rateEl.title='⚠ Rate changed from default ₹'+baseRate;
  } else {
    rateEl.classList.remove('fi-rate-changed');
    rateEl.title='Edit rate for this batch';
  }
}

function openRMDropdownEF(id){
  const q=(document.getElementById('rmsearch-'+id)?.value||'').toLowerCase();
  renderRMDropdownEF(id,q);
  document.getElementById('rmdrop-'+id)?.classList.add('open');
  document.querySelectorAll('.rm-dropdown.open').forEach(d=>{if(d.id!=='rmdrop-'+id)d.classList.remove('open');});
}
function filterRMDropdownEF(id){
  const q=(document.getElementById('rmsearch-'+id)?.value||'').toLowerCase();
  renderRMDropdownEF(id,q);
  document.getElementById('rmdrop-'+id)?.classList.add('open');
}
function renderRMDropdownEF(id,q){
  const drop=document.getElementById('rmdrop-'+id);if(!drop)return;
  const filtered=DB.rawMaterials.filter(r=>r.name.toLowerCase().includes(q)||r.code.toLowerCase().includes(q));
  if(filtered.length===0){drop.innerHTML=`<div class="rm-dropdown-empty">No materials found</div>`;return;}
  drop.innerHTML=filtered.map(r=>`<div class="rm-dropdown-item" onclick="selectRMEF('${id}',${r.id},'${r.name.replace(/'/g,"\\'")}','${r.code}','${r.unit}')"><span>${r.name}</span><span class="rm-code">${r.code} · ${r.unit}${can('viewCost')&&r.rate?' · <strong style="color:var(--accent2)">₹'+r.rate+'</strong>':''}</span></div>`).join('');
}
function handleRMDropdownKeyEF(e,id){handleRMDropdownKey(e,id);}
function selectRMEF(id,rmId,rmName,rmCode,rmUnit){
  document.getElementById('efsel-'+id).value=rmId;
  document.getElementById('rmsearch-'+id).value=`${rmName} (${rmCode})`;
  const unitSel=document.getElementById('efunit-'+id);
  if(unitSel) unitSel.value=rmUnit;
  // Populate rate field
  const rm=getRMById(rmId);
  const rateEl=document.getElementById('efrate-'+id);
  const baseRateEl=document.getElementById('efbaserate-'+id);
  if(rateEl&&rm){rateEl.value=rm.rate||0;rateEl.classList.remove('fi-rate-changed');}
  if(baseRateEl&&rm) baseRateEl.value=rm.rate||0;
  document.getElementById('rmdrop-'+id)?.classList.remove('open');
  document.getElementById('efqty-'+id)?.focus();
  updateEfLiveTotal();
}
function updateEfLiveTotal(){
  let totalKg=0,totalG=0,totalCost=0,lineCount=0;
  document.querySelectorAll('[id^="efitem-"]').forEach(row=>{
    const id=row.id;
    const rmId=parseInt(document.getElementById('efsel-'+id)?.value)||0;
    const qty=parseFloat(document.getElementById('efqty-'+id)?.value)||0;
    const unit=(document.getElementById('efunit-'+id)?.value||'KG').toUpperCase();
    const rm=getRMById(rmId);
    const rateEl=document.getElementById('efrate-'+id);
    const rate=rateEl?parseFloat(rateEl.value)||0:(rm?rm.rate||0:0);
    if(unit==='G'||unit==='ML') totalG+=qty; else totalKg+=qty;
    lineCount++;
    if(rm&&can('viewCost')){
      const qtyKg=(unit==='G'||unit==='ML')?qty/1000:qty;
      const lineCost=qtyKg*rate;
      totalCost+=lineCost;
      const costEl=document.getElementById('efcost-'+id);
      if(costEl) costEl.textContent=qty>0?fmtCurrency(lineCost):'—';
    }
  });
  const totalQtyKg=totalKg+(totalG/1000);
  const panel=document.getElementById('ef-live-total');if(!panel)return;
  if(can('viewCost')){
    const totalWithPkgEf=totalCost+(DB.packagingCost||0)*totalQtyKg;
    const costPerKgEf=totalQtyKg>0?totalWithPkgEf/totalQtyKg:0;
    panel.innerHTML=`
      <div class="fm-lt-item"><div class="fm-lt-label">Materials</div><div class="fm-lt-value">${lineCount}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Total Qty</div><div class="fm-lt-value amber">${totalQtyKg.toFixed(3)} KG</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">RM Cost</div><div class="fm-lt-value green">${fmtCurrency(totalCost)}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">+Packaging</div><div class="fm-lt-value green">${fmtCurrency(totalWithPkgEf)}</div></div>
      <div class="fm-lt-item" style="border-left:2px solid #fbbf24;padding-left:14px;"><div class="fm-lt-label" style="color:#fbbf24;font-size:11px;font-weight:800;">COST / KG</div><div style="font-size:30px;font-weight:900;color:#fbbf24;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;line-height:1;">${totalQtyKg>0?fmtCurrency(costPerKgEf):'—'}</div></div>`;
  } else {
    panel.innerHTML=`
      <div class="fm-lt-item"><div class="fm-lt-label">Materials</div><div class="fm-lt-value">${lineCount}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Total Qty</div><div class="fm-lt-value amber">${totalQtyKg.toFixed(3)} KG</div></div>`;
  }
}

function saveEditFormulation(id){
  const f=DB.formulations.find(x=>x.id===id);
  if(!f){toast('Formulation not found','error');return;}
  const pname=document.getElementById('ef-pname').value.trim();
  const pcode=document.getElementById('ef-pcode').value.trim();
  const batch=document.getElementById('ef-batch').value.trim();
  const remarks=document.getElementById('ef-remarks').value.trim();
  if(!pname){toast('Product Name is required','error');return;}
  const items=[];
  document.querySelectorAll('[id^="efitem-"]').forEach(row=>{
    const rowId=row.id;
    const rmId=parseInt(document.getElementById('efsel-'+rowId)?.value)||0;
    const qty=parseFloat(document.getElementById('efqty-'+rowId)?.value)||0;
    const unit=document.getElementById('efunit-'+rowId)?.value||'KG';
    const rm=getRMById(rmId);
    const rateEl=document.getElementById('efrate-'+rowId);
    const rate=rateEl?parseFloat(rateEl.value)||0:(rm?rm.rate||0:0);
    if(rmId&&qty>0) items.push({rmId,qty,unit,rate});
  });
  if(items.length===0){toast('Add at least one ingredient','error');return;}
  f.productName=pname;
  f.productCode=pcode;
  f.batchNo=batch;
  f.remarks=remarks;
  f.items=items;
  addAudit('Edited formulation recipe',`${pcode} — Batch ${batch}`);
  gasCall('saveFormulation',{formulation:f,items,inventoryUpdates:[],transactions:[],debitInventory:false})
    .then(()=>toast('Recipe updated in Google Sheets ✓','success'));
  closeModal('edit-form-modal');
  toast('Recipe updated successfully ✓','success');
  navigate('formulations');
}

let _scalerCount=0;
function toggleScaler(){
  const wrap=document.getElementById('fm-scaler-wrap');
  const lbl=document.getElementById('scaler-toggle-lbl');
  if(!wrap)return;
  const isHidden=wrap.style.display==='none';
  wrap.style.display=isHidden?'block':'none';
  if(lbl)lbl.textContent=isHidden?'Hide Scaler':'Show Scaler';
  if(isHidden&&document.querySelectorAll('#scaler-products .scaler-product-row').length===0){
    addScalerProduct();
  }
}

function addScalerProduct(){
  _scalerCount++;
  const n=_scalerCount;
  const formOpts=DB.formulations.map(f=>`<option value="${f.id}">${f.productName}${f.productCode?' ('+f.productCode+')':''} — ${calcTotalQty(f).toFixed(2)} KG base</option>`).join('');
  const row=document.createElement('div');
  row.className='scaler-product-row';
  row.id='sp-'+n;
  row.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;">
        <span style="background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;">${n}</span>
        Product ${n}
      </div>
      ${n>1?`<button onclick="document.getElementById('sp-${n}').remove()" style="background:var(--red-light);border:1px solid #fca5a5;color:var(--red);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;">✕ Remove</button>`:''}
    </div>
    <div class="form-row">
      <div class="form-group" style="margin-bottom:10px;">
        <label style="font-size:11px;">Base Formulation</label>
        <select class="form-control" id="sp-form-${n}" style="font-size:13px;" onchange="scalerUpdateBase(${n})">
          <option value="">— Use items from this modal —</option>
          ${formOpts}
        </select>
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label style="font-size:11px;">Required Quantity (KG)</label>
        <input class="form-control" id="sp-qty-${n}" type="number" step="0.01" min="0.01" placeholder="e.g. 500" style="font-size:13px;font-weight:700;">
      </div>
    </div>
    <div id="sp-base-info-${n}" style="font-size:11px;color:var(--text3);margin-top:-6px;margin-bottom:6px;"></div>`;

function scalerUpdateBase(n){
  const fId=parseInt(document.getElementById('sp-form-'+n)?.value)||0;
  const infoEl=document.getElementById('sp-base-info-'+n);
  if(!infoEl)return;
  if(!fId){infoEl.textContent='Using items entered in this modal as the base formulation.';return;}
  const f=DB.formulations.find(x=>x.id===fId);
  if(!f){infoEl.textContent='';return;}
  const base=calcTotalQty(f);
  infoEl.textContent=`Base size: ${base.toFixed(3)} KG · ${f.items.length} raw materials`;
}

function _getScalerBaseItems(fId){
  // If fId is set, use that formulation's items; else read from the current modal
  if(fId){
    const f=DB.formulations.find(x=>x.id===fId);
    return f?f.items:[];
  }
  // Read from current modal form items
  const items=[];
  document.querySelectorAll('[id^="fitem-"]').forEach(row=>{
    const id=row.id;
    const rmId=parseInt(document.getElementById('sel-'+id)?.value)||0;
    const qty=parseFloat(document.getElementById('qty-'+id)?.value)||0;
    const unit=document.getElementById('fmunit-'+id)?.value||'KG';
    const rateEl=document.getElementById('rate-'+id);
    const rm=getRMById(rmId);
    const rate=rateEl?parseFloat(rateEl.value)||0:(rm?rm.rate||0:0);
    if(rmId&&qty>0)items.push({rmId,qty,unit,rate});
  });
  return items;
}

function runScaler(){
  const resultEl=document.getElementById('scaler-result');
  if(!resultEl)return;
  const rows=document.querySelectorAll('#scaler-products .scaler-product-row');
  if(rows.length===0){resultEl.innerHTML='<div class="alert alert-error">Add at least one product row.</div>';return;}

  // Collect all product specs
  const products=[];
  let hasError=false;
  rows.forEach(row=>{
    const n=row.id.replace('sp-','');
    const fId=parseInt(document.getElementById('sp-form-'+n)?.value)||0;
    const reqKg=parseFloat(document.getElementById('sp-qty-'+n)?.value)||0;
    if(reqKg<=0){hasError=true;return;}
    const baseItems=_getScalerBaseItems(fId);
    if(baseItems.length===0){hasError=true;return;}
    // Compute base KG total
    const baseKg=baseItems.reduce((s,i)=>{
      const u=(i.unit||'KG').toUpperCase();
      return s+((u==='G'||u==='ML')?i.qty/1000:i.qty);
    },0);
    if(baseKg<=0){hasError=true;return;}
    const scaleFactor=reqKg/baseKg;
    let fName='Current Formulation';
    if(fId){const f=DB.formulations.find(x=>x.id===fId);if(f)fName=f.productName+(f.productCode?' ('+f.productCode+')':'');}
    products.push({name:fName,reqKg,baseKg,scaleFactor,baseItems});
  });

  if(hasError||products.length===0){
    resultEl.innerHTML='<div class="alert alert-error">Please enter valid required quantities for all products.</div>';
    return;
  }

  // Aggregate RM totals across all products
  const rmTotals={};// rmId -> {name, code, unit, totalQty, totalCost}
  let grandCost=0, grandKg=0;

  products.forEach(p=>{
    p.baseItems.forEach(item=>{
      const rm=getRMById(item.rmId);if(!rm)return;
      const u=(item.unit||rm.unit||'KG').toUpperCase();
      const scaledQty=item.qty*p.scaleFactor;
      const scaledKg=(u==='G'||u==='ML')?scaledQty/1000:scaledQty;
      const rate=(item.rate!==undefined&&item.rate!==null)?item.rate:(rm.rate||0);
      const cost=scaledKg*rate;
      if(!rmTotals[item.rmId])rmTotals[item.rmId]={name:rm.name,code:rm.code,unit:u,totalQtyKg:0,totalCost:0,perProduct:{}};
      rmTotals[item.rmId].totalQtyKg+=scaledKg;
      rmTotals[item.rmId].totalCost+=cost;
      rmTotals[item.rmId].perProduct[p.name]=(rmTotals[item.rmId].perProduct[p.name]||0)+scaledQty;
    });
    grandKg+=p.reqKg;
  });

  Object.values(rmTotals).forEach(r=>{grandCost+=r.totalCost;});
  const grandPkg=(DB.packagingCost||0)*grandKg;
  const grandTotal=grandCost+grandPkg;
  const costPerKg=grandKg>0?grandTotal/grandKg:0;

  // Build product breakdown
  let prodBreakdown='';
  products.forEach(p=>{
    prodBreakdown+=`<div style="display:inline-flex;align-items:center;gap:8px;background:var(--accent-light);border:1px solid #bfdbfe;border-radius:8px;padding:6px 14px;margin-right:8px;margin-bottom:6px;">
      <span style="font-size:11px;font-weight:700;color:var(--accent2);">${p.name}</span>
      <span style="font-size:11px;color:var(--text3);">${p.reqKg} KG</span>
      <span style="font-size:10px;color:var(--text3);">(×${p.scaleFactor.toFixed(3)})</span>
    </div>`;
  });

  // Build RM table
  let rmRows='';
  Object.values(rmTotals).forEach(r=>{
    const displayQty=r.unit==='G'?`${(r.totalQtyKg*1000).toFixed(1)} G`:`${r.totalQtyKg.toFixed(3)} KG`;
    rmRows+=`<tr>
      <td class="td-primary" style="padding:8px 10px;">${r.name}</td>
      <td class="mono" style="padding:8px 10px;font-size:11px;color:var(--text3);">${r.code}</td>
      <td style="padding:8px 10px;font-weight:700;">${displayQty}</td>
      ${can('viewCost')?`<td class="cost-tag" style="padding:8px 10px;">${fmtCurrency(r.totalCost)}</td>`:''}
    </tr>`;
  });

  resultEl.innerHTML=`
    <div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;">
      <div style="background:#0f172a;padding:14px 18px;">
        <div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;">Scaling For</div>
        <div style="display:flex;flex-wrap:wrap;">${prodBreakdown}</div>
      </div>
      <div style="padding:14px 18px;">
        <table class="scaler-result-table">
          <thead><tr><th>Raw Material</th><th>Code</th><th>Total Required</th>${can('viewCost')?'<th>Total Cost</th>':''}</tr></thead>
          <tbody>${rmRows}</tbody>
          <tfoot>
            <tr class="scaler-total-row">
              <td colspan="2" style="padding:10px;">TOTAL — ${grandKg.toFixed(2)} KG production</td>
              <td style="padding:10px;font-size:13px;">${grandKg.toFixed(3)} KG</td>
              ${can('viewCost')?`<td class="cost-tag" style="padding:10px;font-size:13px;font-weight:800;">${fmtCurrency(grandCost)}</td>`:''}
            </tr>
          </tfoot>
        </table>
        ${can('viewCost')?`
        <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
          <div style="background:var(--green-light);border:1px solid #a7f3d0;border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:10px;font-weight:700;color:#065f46;text-transform:uppercase;letter-spacing:.7px;">RM Cost</div>
            <div class="cost-tag" style="font-size:18px;font-weight:800;margin-top:4px;">${fmtCurrency(grandCost)}</div>
          </div>
          <div style="background:var(--blue-light);border:1px solid #93c5fd;border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:10px;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:.7px;">+Packaging</div>
            <div style="font-size:18px;font-weight:800;color:var(--blue);margin-top:4px;">${fmtCurrency(grandPkg)}</div>
          </div>
          <div style="background:#0f172a;border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.7px;">COST / KG</div>
            <div style="font-size:28px;font-weight:900;color:#fbbf24;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;margin-top:4px;">${fmtCurrency(costPerKg)}</div>
          </div>
        </div>
        <div style="margin-top:10px;background:var(--bg3);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12px;font-weight:600;color:var(--text2);">Grand Total (${grandKg.toFixed(2)} KG)</span>
          <span class="cost-tag" style="font-size:20px;font-weight:900;">${fmtCurrency(grandTotal)}</span>
        </div>`:''}
      </div>
    </div>`;
}

let formItemCount=0;
function addFormItem(preRmId=null, preQty=null, preUnit=null, preRate=null){
  formItemCount++;
  const id='fitem-'+formItemCount;
  const preRM=preRmId?DB.rawMaterials.find(r=>r.id===preRmId):null;
  const defaultUnit=preUnit||(preRM?preRM.unit:'KG');
  const defaultRate=preRate!==null?preRate:(preRM?preRM.rate:0);
  const preLabel=preRM?`${preRM.name} (${preRM.code})`:'';
  const showCostCol=can('viewCost');

  // All units for paint/manufacturing companies
  const allUnits=['KG','G','LTR','ML','NOS','PCS','MTR','CM','MM','BOX','BAG','DRUM'];
  const unitOpts=allUnits.map(u=>`<option value="${u}" ${u===defaultUnit?'selected':''}>${u}</option>`).join('');

  document.getElementById('fm-items').insertAdjacentHTML('beforeend',`
    <div class="fi-row ${showCostCol?'':'no-cost'}" id="${id}">
      <div class="rm-search-wrap" style="position:relative;">
        <input class="rm-search-input" id="rmsearch-${id}" placeholder="🔍 Search raw material..." 
          value="${preLabel}" autocomplete="off"
          oninput="filterRMDropdown('${id}')"
          onfocus="openRMDropdown('${id}')"
          onkeydown="handleRMDropdownKey(event,'${id}')">
        <div class="rm-dropdown" id="rmdrop-${id}"></div>
        <input type="hidden" id="sel-${id}" value="${preRmId||''}">
        <input type="hidden" id="baserate-${id}" value="${defaultRate}">
      </div>
      <input class="form-control" id="qty-${id}" type="number" step="0.001" min="0" value="${preQty||''}" placeholder="Qty" oninput="updateFmLiveTotal()">
      <select class="form-control" id="fmunit-${id}" style="padding:10px 6px;font-size:12px;" onchange="updateFmLiveTotal()">${unitOpts}</select>
      ${showCostCol?`<input class="fi-rate" id="rate-${id}" type="number" step="0.01" min="0" value="${defaultRate||''}" placeholder="Rate" title="Edit rate for this batch" oninput="onRateInput('${id}');updateFmLiveTotal()">`:''}
      ${showCostCol?`<span class="fi-cost" id="ficost-${id}">—</span>`:''}
      <button class="remove-btn" onclick="document.getElementById('${id}').remove();updateFmLiveTotal()">−</button>
    </div>`);

  if(!preRmId) openRMDropdown(id);
  updateFmLiveTotal();
}

// Highlight rate field yellow when user edits it away from default
function onRateInput(id){
  const rateEl=document.getElementById('rate-'+id);
  const baseRate=parseFloat(document.getElementById('baserate-'+id)?.value)||0;
  if(!rateEl)return;
  const currentRate=parseFloat(rateEl.value)||0;
  if(currentRate!==baseRate){
    rateEl.classList.add('fi-rate-changed');
    rateEl.title='⚠ Rate changed from default ₹'+baseRate;
  } else {
    rateEl.classList.remove('fi-rate-changed');
    rateEl.title='Edit rate for this batch';
  }
}

function updateFmLiveTotal(){
  let totalKg=0, totalG=0, totalCost=0, lineCount=0;
  document.querySelectorAll('[id^="fitem-"]').forEach(row=>{
    const id=row.id;
    const rmId=parseInt(document.getElementById('sel-'+id)?.value)||0;
    const qty=parseFloat(document.getElementById('qty-'+id)?.value)||0;
    const unit=(document.getElementById('fmunit-'+id)?.value||'KG').toUpperCase();
    const rm=getRMById(rmId);
    const rateEl=document.getElementById('rate-'+id);
    const rate=rateEl?parseFloat(rateEl.value)||0:(rm?rm.rate||0:0);
    if(unit==='G'||unit==='ML') totalG+=qty; else totalKg+=qty;
    lineCount++;
    if(rm&&can('viewCost')){
      // cost: if G, rate is per KG so convert
      const qtyKg=(unit==='G'||unit==='ML')? qty/1000 : qty;
      const lineCost=qtyKg*rate;
      totalCost+=lineCost;
      const costEl=document.getElementById('ficost-'+id);
      if(costEl) costEl.textContent=qty>0?fmtCurrency(lineCost):'—';
    }
  });
  const totalQtyKg=totalKg+(totalG/1000);
  const qtyLabel=`${totalQtyKg.toFixed(3)} KG`;
  const panel=document.getElementById('fm-live-total');
  if(!panel) return;
  if(can('viewCost')){
    const totalWithPkg=totalCost+(DB.packagingCost||0)*totalQtyKg;
    const costPerKg=totalQtyKg>0?totalWithPkg/totalQtyKg:0;
    panel.innerHTML=`
      <div class="fm-lt-item"><div class="fm-lt-label">Materials Added</div><div class="fm-lt-value">${lineCount}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Total Qty</div><div class="fm-lt-value amber" style="font-size:13px;">${qtyLabel}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">RM Cost</div><div class="fm-lt-value green">${fmtCurrency(totalCost)}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">+Packaging</div><div class="fm-lt-value green">${fmtCurrency(totalWithPkg)}</div></div>
      <div class="fm-lt-item" style="border-left:2px solid #fbbf24;padding-left:14px;"><div class="fm-lt-label" style="color:#fbbf24;font-size:11px;font-weight:800;">COST / KG</div><div style="font-size:30px;font-weight:900;color:#fbbf24;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;line-height:1;">${totalQtyKg>0?fmtCurrency(costPerKg):'—'}</div></div>`;
  } else {
    panel.innerHTML=`
      <div class="fm-lt-item"><div class="fm-lt-label">Materials Added</div><div class="fm-lt-value">${lineCount}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Total Qty</div><div class="fm-lt-value amber" style="font-size:13px;">${qtyLabel}</div></div>
      <div class="fm-lt-item"><div class="fm-lt-label">Status</div><div class="fm-lt-value" style="color:#34d399;font-size:12px;">${lineCount>0?'✓ Ready':'Add items'}</div></div>`;
  }
}

function openRMDropdown(id){
  const input=document.getElementById('rmsearch-'+id);
  const q=(input?.value||'').toLowerCase();
  renderRMDropdown(id,q);
  document.getElementById('rmdrop-'+id)?.classList.add('open');
  // Close other dropdowns
  document.querySelectorAll('.rm-dropdown.open').forEach(d=>{if(d.id!=='rmdrop-'+id)d.classList.remove('open');});
}

function filterRMDropdown(id){
  const q=(document.getElementById('rmsearch-'+id)?.value||'').toLowerCase();
  renderRMDropdown(id,q);
  document.getElementById('rmdrop-'+id)?.classList.add('open');
}

function renderRMDropdown(id,q){
  const drop=document.getElementById('rmdrop-'+id);
  if(!drop)return;
  const filtered=DB.rawMaterials.filter(r=>
    r.name.toLowerCase().includes(q)||r.code.toLowerCase().includes(q)||
    (r.supplier&&r.supplier.toLowerCase().includes(q))
  );
  if(filtered.length===0){
    drop.innerHTML=`<div class="rm-dropdown-empty">No materials found for "${q}"</div>`;
  } else {
    drop.innerHTML=filtered.map(r=>
      `<div class="rm-dropdown-item" data-rmid="${r.id}" data-rmname="${r.name}" data-rmcode="${r.code}" data-rmunit="${r.unit}"
         onclick="selectRM('${id}',${r.id},'${r.name.replace(/'/g,"\\'")}','${r.code}','${r.unit}')">
         <span>${r.name}</span><span class="rm-code">${r.code} · ${r.unit}${can('viewCost')&&r.rate?' · <strong style="color:var(--accent2)">₹'+r.rate+'</strong>':''}</span>
       </div>`
    ).join('');
  }
}

function selectRM(id,rmId,rmName,rmCode,rmUnit){
  // Works for both formulation items (sel-) and CA items (casel-)
  const hiddenFm=document.getElementById('sel-'+id);
  const hiddenCA=document.getElementById('casel-'+id);
  if(hiddenFm) hiddenFm.value=rmId;
  if(hiddenCA) hiddenCA.value=rmId;
  document.getElementById('rmsearch-'+id).value=`${rmName} (${rmCode})`;
  // Set the unit dropdown if it exists (formulation modal)
  const unitSel=document.getElementById('fmunit-'+id);
  if(unitSel&&rmUnit){
    unitSel.value=rmUnit;
    if(!unitSel.value) unitSel.value='KG'; // fallback
  }
  // Legacy unit span (fallback)
  const unitEl=document.getElementById('unit-'+id);
  if(unitEl) unitEl.textContent=rmUnit;
  // ── Populate editable rate field with RM's current rate ──
  const rm=getRMById(rmId);
  const rateEl=document.getElementById('rate-'+id);
  const baseRateEl=document.getElementById('baserate-'+id);
  if(rateEl&&rm){
    rateEl.value=rm.rate||0;
    rateEl.classList.remove('fi-rate-changed');
    rateEl.title='Edit rate for this batch';
  }
  if(baseRateEl&&rm) baseRateEl.value=rm.rate||0;
  document.getElementById('rmdrop-'+id)?.classList.remove('open');
  // Focus qty field (either naming convention)
  const qtyEl=document.getElementById('qty-'+id)||document.getElementById('caqty-'+id);
  qtyEl?.focus();
  // Update live total
  if(typeof updateFmLiveTotal==='function') updateFmLiveTotal();
}

function handleRMDropdownKey(e,id){
  const drop=document.getElementById('rmdrop-'+id);
  const items=[...drop.querySelectorAll('.rm-dropdown-item')];
  const hi=drop.querySelector('.highlighted');
  let idx=items.indexOf(hi);
  if(e.key==='ArrowDown'){e.preventDefault();if(hi)hi.classList.remove('highlighted');items[Math.min(idx+1,items.length-1)]?.classList.add('highlighted');}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi)hi.classList.remove('highlighted');items[Math.max(idx-1,0)]?.classList.add('highlighted');}
  else if(e.key==='Enter'&&hi){e.preventDefault();hi.click();}
  else if(e.key==='Escape'){drop.classList.remove('open');}
}

function saveFormulation(){
  const pname=document.getElementById('fm-pname').value.trim();
  const pcode=document.getElementById('fm-pcode').value.trim();
  const batch=document.getElementById('fm-batch').value.trim();
  const mfgDateTime=nowDateTime();
  const remarks=document.getElementById('fm-remarks').value.trim();
  const refNo=document.getElementById('fm-refno')?.value.trim()||'';
  const productType=document.getElementById('fm-ptype')?.value||'';
  const productFinish=document.getElementById('fm-pfinish')?.value||'';
  const partyId='';  // auto-populated in Google Sheet via VLOOKUP on refNo
  const lots=1;  // lots removed from new formulation form; always saved as 1
  // Admin NEVER debits inventory. Only formulation role users do (when debit setting is ON)
  const debit = currentUser.role !== 'admin' && DB.settings.debitInventoryOnSave;

  if(!pname){toast('Product Name is required','error');return;}

  const items=[];
  document.querySelectorAll('[id^="fitem-"]').forEach(row=>{
    const id=row.id;
    const rmId=parseInt(document.getElementById('sel-'+id).value);
    const baseQty=parseFloat(document.getElementById('qty-'+id).value);
    const unit=document.getElementById('fmunit-'+id)?.value||'KG';
    // Save overridden rate if admin provided one
    const rateEl=document.getElementById('rate-'+id);
    const rm=getRMById(rmId);
    const rate=rateEl?parseFloat(rateEl.value)||0:(rm?rm.rate||0:0);
    if(rmId&&baseQty>0)items.push({rmId,qty:baseQty*lots,unit,rate});
  });
  if(items.length===0){toast('Add at least one raw material','error');return;}

  // Stock check only if debit is ON
  if(debit){
    for(const item of items){
      const inv=getInvByRMId(item.rmId);
      if(inv.quantity<item.qty){
        const rm=getRMById(item.rmId);
        toast(`Insufficient stock for ${rm.name}: need ${item.qty}, have ${inv.quantity.toFixed(2)}`,'error');
        return;
      }
    }
    // Deduct inventory
    items.forEach(item=>{
      const inv=DB.inventory.find(i=>i.rmId===item.rmId);
      if(inv) inv.quantity-=item.qty;
      DB.stockTransactions.push({id:DB.nextId.txn++,rmId:item.rmId,type:'consumption',qty:-item.qty,date:mfgDateTime.slice(0,10),remarks:`Batch ${batch}`,by:currentUser.username});
    });
  }

  const f={id:DB.nextId.formulation++,productName:pname,productCode:pcode,productType,productFinish,batchNo:batch,mfgDate:mfgDateTime,remarks,refNo,partyId,by:currentUser.username,byName:currentUser.name,createdAt:mfgDateTime,lots,inventoryDebited:debit,items};
  DB.formulations.push(f);
  const debitNote=debit?' — inventory debited':' — inventory NOT debited (Debit Off)';
  const auditEntry={time:mfgDateTime,user:currentUser.name,action:'Created formulation',detail:`${pcode} — Batch ${batch}${lots>1?' ('+lots+' lots)':''}${debitNote}`};
  DB.auditLog.unshift(auditEntry);

  closeModal('form-modal');
  toast(debit?'Saving to Google Sheets...':'Formulation saved (inventory not debited — Debit Off)','info');

  const invUpdates=debit?items.map(item=>({rmId:item.rmId,newQuantity:getInvByRMId(item.rmId).quantity})):[];
  const txns=debit?DB.stockTransactions.filter(t=>t.remarks===`Batch ${batch}`):[];
  gasCall('saveFormulation',{formulation:f,items,inventoryUpdates:invUpdates,transactions:txns,debitInventory:debit})
    .then(()=>gasCall('addAudit',{entry:auditEntry}))
    .then(()=>toast(debit?'Formulation saved to Google Sheets ✓':'Formulation saved ✓ (no inventory debit)','success'));

  navigate('formulations');
}

  };
  DB.formulationComments.push(comment);

  const f=DB.formulations.find(x=>x.id===formulationId);

function _getCAItems(){
  const items=[];
  document.querySelectorAll('#ca-items-wrap [id^="caitem-"]').forEach(row=>{
    const id=row.id;
    const rmId=parseInt(document.getElementById('casel-'+id)?.value);
    const qty=parseFloat(document.getElementById('caqty-'+id)?.value)||0;
    if(rmId&&qty>0) items.push({rmId,qty});
  });
  return items;
}

function previewCostAnalysis(){
  const items=_getCAItems();
  const bsize=parseFloat(document.getElementById('ca-bsize')?.value)||1;
  const lots=parseInt(document.getElementById('ca-lots')?.value)||1;
  let rmCost=0;
  const rows=items.map(item=>{
    const rm=getRMById(item.rmId);if(!rm)return'';
    const effQty=item.qty*lots;
    const c=effQty*rm.rate;
    rmCost+=c;
    return`<tr><td class="td-primary">${rm.name}</td><td>${item.qty} × ${lots} = ${effQty} ${rm.unit}</td><td class="cost-tag">${fmtCurrency(rm.rate)}</td><td class="cost-tag">${fmtCurrency(c)}</td></tr>`;
  });
  const totalQty=bsize*lots;
  const totalPackaging=(DB.packagingCost||0)*totalQty;
  const total=rmCost+totalPackaging;
  document.getElementById('ca-live-result').innerHTML=`
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:4px;">
      <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;">Live Preview</div>

      <div style="display:flex;justify-content:flex-end;"><table style="width:300px;border-collapse:collapse;">
        <tr><td style="padding:6px 10px;color:var(--text2);">RM Total</td><td class="cost-tag" style="padding:6px 10px;text-align:right;">${fmtCurrency(rmCost)}</td></tr>
        <tr><td style="padding:6px 10px;color:var(--text2);">Packaging (₹${DB.packagingCost}/kg × ${totalQty} kg)</td><td class="cost-tag" style="padding:6px 10px;text-align:right;">${fmtCurrency(totalPackaging)}</td></tr>
        <tr style="background:var(--accent-light);"><td style="padding:10px;font-weight:800;color:var(--text);">TOTAL COST</td><td class="cost-tag" style="padding:10px;text-align:right;font-size:16px;font-weight:800;">${fmtCurrency(total)}</td></tr>

function saveCostAnalysis(){
  const name=document.getElementById('ca-name')?.value.trim();
  const productRef=document.getElementById('ca-pref')?.value.trim();
  const batchSize=parseFloat(document.getElementById('ca-bsize')?.value)||0;
  const lots=parseInt(document.getElementById('ca-lots')?.value)||1;
  const notes=document.getElementById('ca-notes')?.value.trim();
  if(!name){toast('Analysis Name is required','error');return;}
  if(!batchSize){toast('Batch size is required','error');return;}
  const items=_getCAItems();
  if(items.length===0){toast('Add at least one material','error');return;}
  let rmCost=0;
  items.forEach(item=>{const rm=getRMById(item.rmId);if(rm)rmCost+=item.qty*lots*rm.rate;});
  const totalQty=batchSize*lots;
  const totalPackaging=(DB.packagingCost||0)*totalQty;
  const totalCost=rmCost+totalPackaging;
  const rec={
    id:DB.nextId.ca++,
    name,productRef,batchSize,lots,notes,items,
    rmCost,packagingCost:totalPackaging,totalCost,costPerKg:totalCost/totalQty,
    savedBy:currentUser.name,savedAt:nowDateTime()
  };
  DB.costAnalysisRecords.push(rec);
  addAudit('Saved cost analysis',`${name} — ${fmtCurrency(totalCost)}`);
  closeModal('ca-modal');
  toast('Cost analysis saved ✓','success');
  navigate('costanalysis');
}

function exportSingleCostAnalysis(id){
  const rec=DB.costAnalysisRecords.find(r=>r.id===id);if(!rec)return;
  const data=[['Material','Code','Unit','Qty/Lot','Lots','Total Qty','Rate','Cost']];
  rec.items.forEach(item=>{
    const rm=getRMById(item.rmId);if(!rm)return;
    const effQty=item.qty*(rec.lots||1);
    data.push([rm.name,rm.code,rm.unit,item.qty,rec.lots||1,effQty,rm.rate,(effQty*rm.rate).toFixed(2)]);
  });
  data.push(['','','','','','','RM Total',rec.rmCost.toFixed(2)]);
  data.push(['','','','','','','Packaging',DB.packagingCost.toFixed(2)]);
  data.push(['','','','','','','TOTAL',rec.totalCost.toFixed(2)]);
  data.push(['','','','','','','Cost/KG',rec.costPerKg.toFixed(2)]);
  dlExcel(data,`CostAnalysis_${rec.name.replace(/\s+/g,'_')}`);
}

function exportCostAnalysisDB(){

  });
  dlExcel(data,'CostAnalysis_Database');
}
